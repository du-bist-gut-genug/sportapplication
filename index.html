/* ── thème clair ── */
:root{
  --bg:#EEF1F5; --card:#FFFFFF; --card2:#F1F3F7; --line:#E0E5EC;
  --ink:#0E1520; --dim:#5A6677; --dim2:#8C96A5;
  --prim:#06B37A; --prim2:#04916B; --prim3:#0BC287; --prim-soft:#E4F7F0;
  --navy:#101826; --navy2:#1B2536; --onNavy:#FFFFFF;
  --amber:#F5A524; --amber-soft:#FEF1D8; --amber-ink:#8F5D06;
  --braise1:#FFC93C; --braise2:#FF7A1F; --braise3:#EE3F2C; --braise-ink:#B5420E; --braise-soft:#FFEFE2;
  --coral:#E8473A; --blue:#2E7CF6;
  --sh:0 1px 0 rgba(14,21,32,.03),0 10px 28px -14px rgba(14,21,32,.22);
  --sh2:0 2px 6px rgba(14,21,32,.05),0 22px 44px -18px rgba(14,21,32,.32);
  --ombre-prim:rgba(6,179,122,.28);
  --r1:28px; --r2:20px; --r3:14px; --r:20px;
  --ease:cubic-bezier(.22,1,.36,1);
  --disp:"Forge","Arial Narrow","Roboto Condensed",sans-serif;
  --txt:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
}
/* ── thème sombre : la nuit de la planche d'icônes ── */
[data-theme="sombre"]{
  --bg:#0B1018; --card:#121A25; --card2:#1A2331; --line:#222D3B;
  --ink:#EDF1F6; --dim:#909CAD; --dim2:#5F6B7C;
  --prim:#0BC287; --prim2:#5AE3B4; --prim3:#0BC287; --prim-soft:rgba(11,194,135,.14);
  --navy:#070B11; --navy2:#121A25; --onNavy:#EDF1F6;
  --amber:#FFC94D; --amber-soft:rgba(255,201,77,.12); --amber-ink:#FFD98A;
  --braise-ink:#FFA463; --braise-soft:rgba(255,122,31,.12);
  --coral:#FF6A55; --blue:#5AA0FF;
  --sh:0 0 0 1px var(--line);
  --sh2:0 0 0 1px var(--line),0 24px 48px -16px rgba(0,0,0,.7);
}
html{background:var(--bg);transition:background .35s var(--ease)}
body{font-family:var(--txt);color:var(--ink);min-height:100vh;background:var(--bg);
  font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;letter-spacing:-.01em;
  padding-bottom:var(--pb,120px);overflow-x:hidden;transition:color .35s var(--ease)}
.bg{display:none}
button{font-family:inherit;border:none;cursor:pointer;color:inherit;font-variant-numeric:tabular-nums;
  transition:transform .16s var(--ease),background .2s ease,box-shadow .2s ease,opacity .2s ease,color .2s ease}
button:active{transform:scale(.97)}
button:focus-visible,.in:focus-visible,select:focus-visible{outline:2px solid var(--prim);outline-offset:2px}
input,select{font-family:inherit}
.wrap{max-width:520px;margin:0 auto;padding:0 16px}

/* ── en-tête : date du jour et cycle ── */
.hd{position:sticky;top:0;z-index:35;padding:calc(env(safe-area-inset-top,0px) + 12px) 0 10px;
  background:color-mix(in srgb,var(--bg) 86%,transparent);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.hd .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px}
.hd h1{font-family:var(--disp);font-size:24px;font-weight:700;letter-spacing:0;line-height:1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#cyc{display:flex;align-items:center;gap:8px;flex:none}
.cy-seg{display:flex;gap:3px}
.cy-seg i{width:9px;height:14px;border-radius:3px;background:var(--line)}
.cy-seg i.f{background:var(--dim2)}
.cy-seg i.c{background:var(--prim)}
.cy-seg i.dl{background:transparent;box-shadow:inset 0 0 0 1.5px var(--amber)}
.cy-seg i.dl.c{background:var(--amber);box-shadow:none}
.cy-t{font-size:12px;font-weight:650;color:var(--dim);white-space:nowrap}
.cy-t em{font-style:normal;color:var(--dim2)}

/* ── entrées d'écran : un seul mouvement, au changement de vue ── */
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.85);opacity:0}60%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
@keyframes grow{from{width:0}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes slidein{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
#app.entre>.wrap{animation:rise .38s var(--ease) both}
.boum{animation:pop .5s var(--ease) .2s both}
.note{margin-top:12px;padding:13px 15px;border-radius:var(--r3);background:var(--amber-soft);
  color:var(--amber-ink);font-size:12.5px;font-weight:600;line-height:1.45}

/* ── carte du jour ── */
.hero{margin-top:16px;border-radius:var(--r);overflow:hidden;position:relative;
  background:linear-gradient(145deg,var(--prim3) 0%,var(--prim) 42%,var(--prim2) 100%);
  box-shadow:0 10px 30px var(--ombre-prim)}
[data-theme="sombre"] .hero{background:linear-gradient(145deg,#0E9E71 0%,#08825E 55%,#066B4D 100%);
  box-shadow:0 10px 30px rgba(0,0,0,.45)}
.hero::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 90% at 88% -14%,rgba(255,255,255,.26),transparent 62%)}
.hero.rest{background:linear-gradient(145deg,var(--navy2),var(--navy));
  box-shadow:0 10px 30px rgba(18,32,58,.24)}
.hero-in{padding:20px 20px 18px;position:relative;z-index:1}
.hero-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-wrap:wrap}
.hero-top h2{flex:1 1 auto;min-width:0}
.hero h2{font-size:26px;font-weight:800;line-height:1.08;letter-spacing:-.04em;color:#fff}
.meta{margin-top:7px;font-size:12.5px;color:rgba(255,255,255,.84);font-weight:600}
.tip{margin-top:14px;font-size:12.5px;line-height:1.5;color:rgba(255,255,255,.92);
  background:rgba(255,255,255,.15);padding:11px 13px;border-radius:16px}
.pbar{margin-top:14px;height:6px;border-radius:4px;background:rgba(255,255,255,.22);overflow:hidden}
.pbar i{display:block;height:100%;border-radius:4px;background:#fff;transition:width .5s var(--ease)}
.go{display:block;width:calc(100% - 32px);margin:0 16px 16px;padding:16px;border-radius:18px;
  font-size:15.5px;font-weight:700;color:var(--prim2);background:#fff;position:relative;z-index:1;
  box-shadow:0 6px 16px rgba(0,0,0,.16)}
/* dans la carte, le bouton suit le padding du bloc et non les marges du bas */
.go.haut{width:100%;margin:16px 0 0}
[data-theme="sombre"] .go{color:#04916B}
.go.alt{background:rgba(255,255,255,.2);color:#fff;box-shadow:none}
.quit{background:rgba(255,255,255,.18);color:#fff;font-size:12.5px;font-weight:650;
  padding:8px 12px;border-radius:999px;flex:none}
.back{background:var(--card);color:var(--ink);font-size:13px;font-weight:650;padding:10px 15px;
  border-radius:999px;box-shadow:var(--sh);margin-top:16px}

/* ── bascule salle / maison ── */
.tg{display:flex;gap:4px;padding:4px;background:rgba(255,255,255,.2);border-radius:999px;flex:none}
.tg button{padding:9px 14px;border-radius:999px;font-size:12px;font-weight:700;color:#fff;background:none;min-height:36px}
.tg button.on{background:#fff;color:var(--prim2)}
.tg.large{width:100%;background:var(--card2);padding:5px;box-shadow:var(--sh)}
.tg.large button{flex:1;padding:13px;font-size:14px;color:var(--dim)}
.tg.large button.on{background:var(--card);color:var(--ink);box-shadow:var(--sh)}
.tg.mini{background:var(--card2);padding:3px}
.tg.mini button{padding:10px 14px;font-size:12px;color:var(--dim);min-height:38px}
.tg.mini button.on{background:var(--card);color:var(--ink);box-shadow:var(--sh)}

.sec{margin:26px 0 10px;font-size:11px;font-weight:750;color:var(--dim2);
  text-transform:uppercase;letter-spacing:.09em}
.week{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.wr{display:flex;align-items:center;gap:12px;padding:14px 16px;font-size:13.5px;width:100%;
  border-bottom:1px solid var(--line);background:none;text-align:left}
.wr:last-child{border-bottom:none}
.wr:active{background:var(--card2);transform:none}
.wr.auj{background:var(--prim-soft)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);flex:none}
.dot.ok{background:var(--prim);box-shadow:0 0 0 4px var(--prim-soft)}
.dot.off{background:transparent;border:1.5px solid var(--dim2)}
.wr b{font-weight:650;min-width:72px;flex:none}
.wr i{font-style:normal;color:var(--dim);font-size:12.5px;flex:1;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.tagl{font-size:10px;font-weight:750;padding:4px 8px;border-radius:999px;flex:none;
  text-transform:uppercase;letter-spacing:.04em}
.tagl.salle{background:var(--prim-soft);color:var(--prim2)}
.tagl.maison{background:var(--card2);color:var(--dim)}
.chev{color:var(--dim2);font-size:18px;flex:none;line-height:1}

/* ── exercices ── */
.ex{margin-bottom:11px;background:var(--card);border-radius:22px;box-shadow:var(--sh);
  overflow:hidden;position:relative;transition:box-shadow .3s var(--ease),opacity .3s ease}
.ex.grp::before{content:"";position:absolute;left:0;top:16px;bottom:16px;width:4px;
  border-radius:0 4px 4px 0;background:var(--blue)}
.ex.now{box-shadow:0 0 0 2px var(--prim),0 10px 28px var(--ombre-prim)}
.ex.fini{opacity:.45}
.exh{padding:16px 18px 0}
.exn{font-size:15.5px;font-weight:700;line-height:1.25;letter-spacing:-.02em}
.exs{font-size:12px;color:var(--dim);margin-top:5px;font-weight:550}
.exo{display:inline-block;font-size:12px;font-weight:700;color:var(--prim2);margin-top:9px;
  background:var(--prim-soft);padding:5px 10px;border-radius:999px;animation:pop .35s var(--ease) both}
.sets{display:flex;gap:7px;padding:13px 18px 16px;flex-wrap:wrap}
.st{font-size:12px;font-weight:650;padding:7px 10px;border-radius:12px;min-width:48px;
  text-align:center;background:var(--card2);color:var(--dim);transition:all .25s var(--ease)}
.st.done{background:var(--navy);color:var(--onNavy);animation:pop .3s var(--ease) both}
[data-theme="sombre"] .st.done{background:var(--card2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.st.cur{background:var(--prim);color:#fff;box-shadow:0 5px 14px var(--ombre-prim)}
.st.pr{background:var(--amber);color:#12203A;box-shadow:0 5px 14px rgba(245,165,36,.4)}
.st em{font-style:normal;display:block;font-size:8.5px;font-weight:800;letter-spacing:.1em;margin-top:2px}
button.st{cursor:pointer;font-family:inherit}
/* Quatre actions ne tiennent pas sur une ligne à 320 px : on autorise le retour
   à la ligne et on fixe une largeur minimale pour que les libellés restent lisibles. */
.acts{display:flex;flex-wrap:wrap;gap:9px;padding:0 18px 16px}
.abtn{flex:1 1 calc(50% - 5px);min-width:0;padding:11px 8px;border-radius:14px;font-size:12.5px;
  font-weight:650;color:var(--dim);background:var(--card2)}
@media(min-width:361px){.abtn{flex:1 1 0}}
.abtn:active{color:var(--ink)}
.swap{display:block;font-size:10.5px;font-weight:700;color:var(--blue);margin-top:4px;
  text-transform:uppercase;letter-spacing:.05em}

/* ── pavé de saisie ── */
.pad{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--card);
  border-radius:28px 28px 0 0;box-shadow:0 -6px 40px rgba(16,24,40,.16);
  padding-bottom:env(safe-area-inset-bottom);animation:rise .3s var(--ease) both}
[data-theme="sombre"] .pad{box-shadow:0 -6px 40px rgba(0,0,0,.55)}
.pad .wrap{padding:16px 18px 20px}
.padt{font-size:12.5px;color:var(--dim);font-weight:650;margin-bottom:12px;
  display:flex;justify-content:space-between;gap:10px}
.padt span:last-child{color:var(--prim2);text-align:right;font-weight:700}
.rows{display:flex;gap:11px}
.fld{flex:1;border-radius:20px;padding:11px 10px 13px;text-align:center;background:var(--card2)}
.fld small{display:block;font-size:10px;color:var(--dim2);font-weight:700;margin-bottom:6px;
  text-transform:uppercase;letter-spacing:.07em}
.fldr{display:flex;align-items:center;justify-content:space-between;gap:6px}
.stp{width:44px;height:44px;border-radius:15px;font-size:23px;font-weight:500;line-height:1;
  background:var(--card);color:var(--ink);box-shadow:0 2px 6px rgba(16,24,40,.12)}
.val{font-size:25px;font-weight:800;flex:1;letter-spacing:-.04em}
.okb{width:100%;margin-top:13px;font-size:16px;font-weight:700;padding:17px;border-radius:20px;
  color:#fff;background:linear-gradient(180deg,var(--prim3),var(--prim2));
  box-shadow:0 8px 22px var(--ombre-prim)}
.okb:disabled{background:var(--card2);color:var(--dim2);box-shadow:none;transform:none}
.plates{margin-top:11px;padding:11px 14px;border-radius:16px;font-size:12px;font-weight:650;
  color:var(--amber-ink);background:var(--amber-soft)}

/* ── chrono ── */
.tm{position:fixed;left:0;right:0;bottom:0;z-index:50;overflow:hidden;
  background:linear-gradient(150deg,var(--navy2),var(--navy));color:#fff;
  border-radius:28px 28px 0 0;box-shadow:0 -6px 40px rgba(16,24,40,.3);
  padding-bottom:env(safe-area-inset-bottom);animation:rise .3s var(--ease) both}
.bar{height:4px;background:linear-gradient(90deg,var(--prim3),#5AE3B4);transition:width .25s linear}
.tmin{padding:20px 18px}
.tmr{display:flex;align-items:center;justify-content:space-between;max-width:520px;margin:0 auto;gap:12px}
.big{font-size:50px;font-weight:800;letter-spacing:-.05em;line-height:1;color:#fff}
.big.go3{color:#5AE3B4;animation:pulse 1s var(--ease) infinite}
.tsub{font-size:12px;color:rgba(255,255,255,.66);font-weight:600;margin-top:5px}
.tbs{display:flex;gap:9px}
.tb{font-size:13px;font-weight:700;padding:14px 16px;border-radius:16px;white-space:nowrap;
  background:rgba(255,255,255,.14);color:#fff}
.tb.go2{background:linear-gradient(180deg,var(--prim3),var(--prim2));
  box-shadow:0 6px 18px var(--ombre-prim)}

/* ── navigation ── */
.nav{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom));left:18px;right:18px;
  max-width:484px;margin:0 auto;display:flex;z-index:30;border-radius:24px;
  background:var(--card);box-shadow:var(--sh2);padding:7px}
.nav button{flex:1;padding:9px 4px;background:none;font-size:10px;font-weight:650;
  color:var(--dim2);display:flex;flex-direction:column;align-items:center;gap:5px;border-radius:18px}
.nav button.on{color:var(--prim2);background:var(--prim-soft)}
.nav em{font-style:normal;font-size:17px;line-height:1;transition:transform .25s var(--ease)}
.nav button.on em{transform:scale(1.12)}

/* ── divers ── */
.card{margin-bottom:11px;padding:18px;background:var(--card);border-radius:22px;box-shadow:var(--sh)}
.card.tap{cursor:pointer}
.det{margin-top:10px;border-top:1px solid var(--line);padding-top:4px;animation:rise .3s var(--ease) both}
.h2{font-size:20px;font-weight:780;letter-spacing:-.03em;margin:26px 0 12px}
.lr{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;
  border-bottom:1px solid var(--line);font-size:13.5px}
.lr:last-child{border-bottom:none}
.mut{color:var(--dim);font-size:12.5px}
.btn{width:100%;margin-top:10px;padding:15px;border-radius:18px;font-size:14px;font-weight:680;
  background:var(--card2);color:var(--ink)}
.btn.prim{background:linear-gradient(180deg,var(--prim3),var(--prim2));color:#fff;
  box-shadow:0 6px 18px var(--ombre-prim)}
.btn.dg{background:var(--coral);color:#fff;box-shadow:0 6px 18px rgba(240,83,63,.28)}
.btn.gh{background:var(--card2);color:var(--ink)}
.sel{width:100%;padding:15px;border-radius:18px;font-size:14px;color:var(--ink);margin-bottom:12px;
  background:var(--card);border:none;box-shadow:var(--sh);appearance:none;font-weight:600}
.in{width:100%;padding:13px;border-radius:15px;font-size:15px;margin-top:5px;color:var(--ink);
  background:var(--card2);border:1.5px solid transparent}
.in::placeholder{color:var(--dim2)}
.in:focus{outline:none;border-color:var(--prim);box-shadow:0 0 0 4px var(--prim-soft)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.g2 label{font-size:10.5px;font-weight:700;color:var(--dim2);text-transform:uppercase;letter-spacing:.06em}
.emp{text-align:center;color:var(--dim);font-size:13.5px;padding:30px 16px;line-height:1.6}

/* ── séries par muscle ── */
.mus{padding:18px}
.mrow{display:flex;align-items:center;gap:11px;margin-bottom:11px}
.mnom{font-size:12.5px;font-weight:650;width:84px;flex:none;color:var(--dim)}
.mtrack{flex:1;height:9px;border-radius:6px;background:var(--card2);position:relative;overflow:hidden}
.mtrack i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;animation:grow .7s var(--ease) both}
.mtrack i.lo{background:var(--dim2)}
.mtrack i.ok{background:linear-gradient(90deg,var(--prim3),var(--prim))}
.mtrack i.hi{background:linear-gradient(90deg,var(--amber),#EF8A15)}
.mtrack u{position:absolute;top:0;bottom:0;width:1.5px;background:var(--card)}
.mval{font-size:12.5px;font-weight:750;width:32px;text-align:right;flex:none;color:var(--dim2)}
.mval.ok{color:var(--prim2)}.mval.hi{color:var(--amber-ink)}
.mleg{font-size:11px;line-height:1.55;color:var(--dim2);margin-top:12px;
  border-top:1px solid var(--line);padding-top:11px}

/* ── graphique ── */
.gh{font-size:12.5px;color:var(--dim);font-weight:650;margin-bottom:8px}
.gsvg{width:100%;height:auto;display:block}
.gl{stroke:var(--line)}
.gt{fill:var(--dim2)}
.gd{fill:var(--prim);stroke:var(--card);stroke-width:1.5}
.gline{stroke:var(--prim)}
.gs1{stop-color:var(--prim);stop-opacity:.22}
.gs2{stop-color:var(--prim);stop-opacity:0}

/* ── feuilles ── */
.ov{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;
  background:rgba(8,11,16,.5);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);
  animation:fade .3s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.sheet{width:100%;max-width:520px;margin:0 auto;border-radius:30px 30px 0 0;padding:24px 20px;
  padding-bottom:calc(24px + env(safe-area-inset-bottom));animation:up .42s var(--ease) both;
  background:var(--card);max-height:88vh;overflow-y:auto}
.sheet.center{text-align:center}
.sh1{font-size:22px;font-weight:800;letter-spacing:-.035em}
.shl{font-size:13px;font-weight:700;margin-top:18px;margin-bottom:3px}
.rs{display:flex;gap:9px;margin-top:9px}
.rs button{flex:1;padding:16px 0;border-radius:16px;font-size:17px;font-weight:750;
  color:var(--dim);background:var(--card2)}
.rs button.on{background:var(--prim);color:#fff;box-shadow:0 6px 18px var(--ombre-prim)}
.subl{display:flex;flex-wrap:wrap;gap:9px;margin-top:13px}
.subi{padding:12px 15px;border-radius:16px;font-size:13px;font-weight:650;color:var(--ink);background:var(--card2)}
.subi.on{background:var(--blue);color:#fff;box-shadow:0 6px 18px rgba(46,124,246,.3)}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ── bouton info ── */
.info{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;
  border-radius:50%;background:var(--card2);color:var(--dim);font-size:14px;font-weight:800;
  font-style:italic;margin-left:8px;vertical-align:-6px;line-height:1;flex:none;font-family:Georgia,serif;
  position:relative}
/* zone tactile élargie sans déplacer le visuel */
.info::after{content:"";position:absolute;inset:-9px}
.info:active{background:var(--prim);color:#fff;transform:scale(1.15)}
.ex.now .info{background:var(--prim-soft);color:var(--prim2)}
.htools{display:flex;gap:6px;flex:0 0 auto;flex-wrap:nowrap;margin-left:auto}
.quit{white-space:nowrap;padding:8px 11px}
@media(max-width:360px){.hero-top h2{flex:1 1 100%}.htools{margin-left:0}}

/* ── fiche d'exécution ── */
.mach{margin-top:14px;padding:14px 16px;border-radius:18px;background:var(--prim-soft);
  color:var(--prim2);font-size:13.5px;font-weight:700;line-height:1.4}
.mlab{display:block;font-size:9.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
  color:var(--prim);opacity:.85;margin-bottom:4px}
.altl{margin-top:8px;display:flex;flex-direction:column;gap:7px}
.alti{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:14px;
  background:var(--card2);font-size:13px;font-weight:600;line-height:1.35}
.alti b{width:21px;height:21px;flex:none;border-radius:50%;background:var(--card);color:var(--dim);
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800}
.errb{margin-top:6px;padding:12px 14px;border-radius:16px;background:var(--amber-soft);
  color:var(--amber-ink);font-size:12.5px;font-weight:600;line-height:1.45}

/* ── réorganisation ── */
.ordi{display:flex;align-items:center;gap:9px;padding:12px 14px;border-radius:16px;
  background:var(--card2);margin-top:8px;animation:slidein .3s var(--ease) both}
.ordi.lock{opacity:.5}
.ordn{flex:1;font-size:13px;font-weight:650;line-height:1.3}
.ordb{width:38px;height:38px;flex:none;border-radius:12px;background:var(--card);color:var(--ink);
  font-size:16px;font-weight:700;box-shadow:var(--sh)}
.ordb:disabled{opacity:.3;box-shadow:none}
.lk{font-size:10px;font-weight:750;text-transform:uppercase;letter-spacing:.06em;color:var(--dim2)}

/* ── séance raccourcie ── */
.chrono-btn{margin-top:12px;padding:9px 14px;border-radius:999px;font-size:12px;font-weight:700;
  background:rgba(255,255,255,.2);color:#fff}
.tipm{margin-top:10px;font-size:11.5px;font-weight:700;color:#fff;background:rgba(255,255,255,.18);
  padding:7px 11px;border-radius:12px;display:inline-block}
.tps{display:flex;flex-direction:column;gap:9px;margin-top:14px}
.tpsi{padding:15px 16px;border-radius:18px;background:var(--card2);color:var(--ink);text-align:left}
.tpsi b{display:block;font-size:15px;font-weight:750}
.tpsi i{font-style:normal;display:block;font-size:11.5px;color:var(--dim);margin-top:2px;font-weight:600}
.tpsi.on i{color:rgba(255,255,255,.8)}
.tpsi.on{background:var(--prim);color:#fff;box-shadow:0 6px 18px var(--ombre-prim)}

/* ── alertes d'accueil ── */
.alerte{display:flex;align-items:center;gap:13px;width:100%;margin-top:11px;padding:14px 16px;
  border-radius:20px;background:var(--amber-soft);text-align:left}
.alerte.photo{background:var(--card)}
.al-ic{width:38px;height:38px;flex:none;border-radius:13px;background:var(--card);display:flex;
  align-items:center;justify-content:center;font-size:17px;font-weight:800;color:var(--amber-ink)}
.al-tx{flex:1;min-width:0}
.al-tx b{display:block;font-size:13.5px;font-weight:700;color:var(--ink)}
.al-tx i{font-style:normal;display:block;font-size:11.5px;color:var(--dim);margin-top:2px}

/* ── stagnation ── */
.stagb{margin-top:8px;padding:9px 12px;border-radius:13px;background:var(--amber-soft);
  color:var(--amber-ink);font-size:11.5px;font-weight:650;line-height:1.4}
.stagi{margin-top:11px;padding:14px;border-radius:18px;background:var(--card2)}
.stagn{font-size:14px;font-weight:750}
.stagc{font-size:12px;color:var(--dim);margin-top:4px;font-weight:600}
.stagq{font-size:12.5px;line-height:1.45;margin-top:7px}

/* ── bilan de séance ── */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.stat{padding:15px 10px;border-radius:18px;background:var(--card2)}
.stat b{display:block;font-size:24px;font-weight:800;letter-spacing:-.035em}
.stat span{display:block;font-size:11px;color:var(--dim);font-weight:650;margin-top:3px}
.stat.or{background:var(--amber-soft)}
.stat.or b{color:var(--amber-ink)}
.cmp{margin-top:12px;padding:12px 14px;border-radius:16px;font-size:12.5px;font-weight:650;line-height:1.4}
.cmp.pos{background:var(--prim-soft);color:var(--prim2)}
.cmp.neg{background:var(--card2);color:var(--dim)}

/* ── échauffement ── */
.echl{margin-top:14px;display:flex;flex-direction:column;gap:9px}
.echi{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:16px;background:var(--card2)}
.echi b{width:24px;height:24px;flex:none;border-radius:50%;background:var(--prim);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800}
.echi span{font-size:13px;font-weight:600;line-height:1.35}

/* ── chrono d'exercice ── */
.chstart{width:100%;margin-top:11px;padding:14px;border-radius:18px;font-size:14px;font-weight:700;
  background:var(--card2);color:var(--ink)}
.fld.chrono{background:var(--prim-soft)}
.fld.chrono .val{color:var(--prim2)}
.stp.stop{background:var(--coral);color:#fff}

/* ── anatomie et mouvement ── */
.visu{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.vbloc{background:var(--card2);border-radius:18px;padding:12px 10px;text-align:center}
.vlab{display:block;font-size:9.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;
  color:var(--dim2);margin-bottom:8px}
.anat{width:100%;height:auto}
.anat .sil{fill:var(--line)}
.anat .mn{fill:var(--dim2);opacity:.35}
.anat .ms{fill:var(--prim);opacity:.42}
.anat .mp{fill:var(--prim);opacity:1}
.anat .anl{fill:var(--dim2);font-size:7px;text-anchor:middle;font-weight:700}
.leg{display:flex;align-items:center;justify-content:center;gap:5px;font-size:9.5px;
  color:var(--dim2);font-weight:650;margin-top:6px;flex-wrap:wrap}
.leg span{width:8px;height:8px;border-radius:50%;display:inline-block}
.leg .lp{background:var(--prim)}
.leg .ls{background:var(--prim);opacity:.42;margin-left:6px}
.mouv{width:100%;height:auto}
.mouv .sol{stroke:var(--line);stroke-width:2;stroke-linecap:round}
.mouv .tete{fill:var(--ink);opacity:.85}
.mouv .tronc,.mouv .os{stroke:var(--ink);stroke-width:4;stroke-linecap:round;opacity:.85}
.mouv .charge rect{fill:var(--prim)}
.mtxt{font-size:10.5px;line-height:1.35;color:var(--dim);margin-top:6px;font-weight:600}
/* mouvements : chaque famille anime les bons segments */
.m-poussee-h .bras-h{transform-origin:60px 33px;animation:mvA 2.4s ease-in-out infinite}
.m-poussee-h .charge{animation:mvCh 2.4s ease-in-out infinite}
@keyframes mvA{0%,100%{transform:rotate(0)}50%{transform:rotate(-26deg)}}
@keyframes mvCh{0%,100%{transform:translateY(0)}50%{transform:translateY(12px)}}
.m-poussee-v .bras-h{transform-origin:60px 33px;animation:mvB 2.4s ease-in-out infinite}
.m-poussee-v .charge{animation:mvBc 2.4s ease-in-out infinite}
@keyframes mvB{0%,100%{transform:rotate(-70deg)}50%{transform:rotate(-120deg)}}
@keyframes mvBc{0%,100%{transform:translateY(-8px)}50%{transform:translateY(-30px)}}
.m-tirage-v .bras-h{transform-origin:60px 33px;animation:mvC 2.6s ease-in-out infinite}
@keyframes mvC{0%,100%{transform:rotate(-115deg)}50%{transform:rotate(-55deg)}}
.m-tirage-v .charge{animation:mvCc 2.6s ease-in-out infinite}
@keyframes mvCc{0%,100%{transform:translateY(-32px)}50%{transform:translateY(-8px)}}
.m-tirage-h .bras-b{transform-origin:78px 42px;animation:mvD 2.4s ease-in-out infinite}
.m-tirage-h .g2 .bras-b{transform-origin:42px 42px}
@keyframes mvD{0%,100%{transform:rotate(0)}50%{transform:rotate(-58deg)}}
.m-elevation .bras-h{transform-origin:60px 33px;animation:mvE 2.6s ease-in-out infinite}
@keyframes mvE{0%,100%{transform:rotate(38deg)}50%{transform:rotate(-30deg)}}
.m-oiseau .corps{transform-origin:60px 58px;transform:rotate(-38deg)}
.m-oiseau .bras-h{transform-origin:60px 33px;animation:mvE 2.6s ease-in-out infinite}
.m-curl .bras-b{transform-origin:78px 42px;animation:mvF 2.2s ease-in-out infinite}
.m-curl .g2 .bras-b{transform-origin:42px 42px}
@keyframes mvF{0%,100%{transform:rotate(0)}50%{transform:rotate(-105deg)}}
.m-extension .bras-b{transform-origin:78px 42px;animation:mvG 2.2s ease-in-out infinite}
.m-extension .g2 .bras-b{transform-origin:42px 42px}
@keyframes mvG{0%,100%{transform:rotate(-95deg)}50%{transform:rotate(5deg)}}
.m-squat .corps{animation:mvH 2.8s ease-in-out infinite}
@keyframes mvH{0%,100%{transform:translateY(0)}50%{transform:translateY(16px)}}
.m-squat .jambe-h{transform-origin:60px 58px;animation:mvHj 2.8s ease-in-out infinite}
@keyframes mvHj{0%,100%{transform:rotate(0)}50%{transform:rotate(-16deg)}}
.m-charniere .corps{transform-origin:60px 58px;animation:mvI 2.8s ease-in-out infinite}
@keyframes mvI{0%,100%{transform:rotate(0)}50%{transform:rotate(-42deg)}}
.m-mollets .corps{animation:mvJ 1.8s ease-in-out infinite}
@keyframes mvJ{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.m-gainage .corps{transform-origin:60px 58px;transform:rotate(-74deg) translateY(-14px)}
.m-grip .charge{animation:mvK 2.2s ease-in-out infinite}
@keyframes mvK{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.m-grip .bras-h,.m-poussee-h .bras-b{transform-origin:60px 33px}

.palb{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
  color:var(--amber-ink);margin-top:8px}

/* ── réorganisation ── */
.ordz{position:relative}
.poig{width:26px;flex:none;text-align:center;font-size:15px;color:var(--dim2);cursor:grab;
  touch-action:none;user-select:none}
.ordi.drag{z-index:5;box-shadow:var(--sh2);background:var(--card);position:relative}
.ordi{touch-action:pan-y}

/* ── célébration plein écran ── */
.feu{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 58%,#2B1403 0%,#120A02 45%,#07070A 100%);
  animation:fade .4s ease both;overflow:hidden;color:#fff}
.parts{position:absolute;inset:0;pointer-events:none}
.parts i{position:absolute;bottom:-10px;width:6px;height:6px;border-radius:50%;
  background:radial-gradient(circle,#FFD86B,#FF8A3D);animation:monte linear infinite;opacity:0}
@keyframes monte{0%{opacity:0;transform:translateY(0) scale(.6)}
  12%{opacity:1}100%{opacity:0;transform:translateY(-105vh) scale(.2)}}
.feu-in{position:relative;text-align:center;padding:20px}
.flamme.geante{width:210px;height:210px;margin:0 auto;border-radius:60px;background:none;
  animation:entree .7s var(--ease) both}
.flamme.geante::before{inset:-20px;border-radius:50%;
  background:radial-gradient(circle at 50% 62%,rgba(255,176,32,.55),transparent 66%)}
.flamme.geante .fl{width:150px;height:190px}
.feu-n{font-size:96px;font-weight:800;letter-spacing:-.06em;line-height:1;margin-top:6px;
  text-shadow:0 0 44px rgba(255,170,40,.6);animation:pop .55s var(--ease) .25s both}
.feu-j{font-size:17px;font-weight:700;opacity:.88;animation:pop .55s var(--ease) .35s both}
.feu-p{margin-top:16px;display:inline-block;padding:9px 18px;border-radius:999px;
  background:rgba(255,176,32,.18);color:#FFD86B;font-size:13px;font-weight:800;
  letter-spacing:.12em;text-transform:uppercase;animation:pop .55s var(--ease) .45s both}
.feu-s{margin-top:14px;font-size:12.5px;opacity:.6;animation:pop .55s var(--ease) .55s both}
.feu-t{margin-top:34px;font-size:12px;opacity:.45;animation:pulse 2.4s ease-in-out 1s infinite}

/* ── exercices complémentaires ── */
.plusm{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.plusl{display:flex;justify-content:space-between;align-items:baseline;font-size:13.5px}
.plusv{font-size:11.5px;font-weight:750}
.plusv.ok{color:var(--prim2)}.plusv.hi{color:var(--amber-ink)}.plusv.lo{color:var(--dim2)}
.plusw{margin-top:6px;font-size:11.5px;color:var(--amber-ink);background:var(--amber-soft);
  padding:9px 11px;border-radius:13px;font-weight:600;line-height:1.4}

/* ── tests ── */
.tst .tstl{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tstl b{font-size:14px}
.tstv{font-size:18px;font-weight:800;text-align:right;color:var(--prim2);line-height:1.1}
.tstv i{display:block;font-style:normal;font-size:9.5px;font-weight:700;color:var(--dim2);
  text-transform:uppercase;letter-spacing:.06em}
.tstv.vide{color:var(--dim2);font-size:22px}
.gain{color:var(--prim2)}.perte{color:var(--coral)}
.estim{margin-top:12px;padding:14px;border-radius:16px;background:var(--prim-soft);
  color:var(--prim2);font-size:14px;font-weight:650;text-align:center}
.estim b{font-size:19px;font-weight:800}

/* ── graphiques multiples ── */
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}
.chip{padding:9px 13px;border-radius:999px;font-size:12px;font-weight:650;background:var(--card);
  color:var(--dim);border:1.5px solid var(--line)}
.chip.on{color:#fff;border-color:transparent}
.clg{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:10px}
.clgi{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:650;color:var(--dim)}
.clgi i{width:12px;height:3px;border-radius:2px;display:inline-block}
.cline{stroke-dasharray:1400;stroke-dashoffset:1400;animation:trace 1.1s var(--ease) both}
@keyframes trace{to{stroke-dashoffset:0}}

/* ── palettes de couleurs ── */
.pals{display:grid;grid-template-columns:repeat(6,1fr);gap:9px}
.pali{aspect-ratio:1;border-radius:14px;border:3px solid transparent;box-shadow:var(--sh)}
.pali.on{border-color:var(--ink);transform:scale(1.08)}
.cust{display:flex;gap:10px;align-items:center;margin-top:8px}
.cust input[type=color]{width:52px;height:48px;border:none;border-radius:14px;background:none;
  padding:0;cursor:pointer}

/* ── retrait d'exercices ── */
.ordb.sup{background:var(--card2);color:var(--coral);font-size:14px}
.ordb.sup:active{background:var(--coral);color:#fff}
.ordi.off{opacity:.6;background:transparent;border:1.5px dashed var(--line)}
.ordi.off .ordn{text-decoration:line-through;color:var(--dim2)}
.ordb.rem{width:auto;padding:0 13px;font-size:12px;font-weight:700;color:var(--prim2);
  background:var(--prim-soft);box-shadow:none}
.restl{margin-top:14px;display:flex;flex-direction:column;gap:8px}
.resti{padding:13px 15px;border-radius:16px;background:var(--card2)}
.restn{font-size:13.5px;font-weight:700;line-height:1.3}
.restn i{display:block;font-style:normal;font-size:11.5px;font-weight:600;color:var(--dim);margin-top:3px}

/* ── salle bondée ── */
.bondl{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.bondi{display:flex;align-items:center;gap:11px;padding:13px 14px;border-radius:16px;
  background:var(--card2);text-align:left;width:100%}
.bcase{width:24px;height:24px;flex:none;border-radius:8px;border:2px solid var(--line);
  background:var(--card);display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:800;color:#fff}
.bondi.on{background:var(--amber-soft)}
.bondi.on .bcase{background:var(--amber);border-color:var(--amber)}
.bnom{flex:1;font-size:13px;font-weight:650;line-height:1.3}
.bet{font-size:10px;font-weight:750;text-transform:uppercase;letter-spacing:.05em;
  color:var(--dim2);flex:none}
.bondi.on .bet{color:var(--amber-ink)}

/* ── sensations ── */
.sensl{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.sensi{display:flex;align-items:center;gap:12px;padding:13px 15px;border-radius:16px;
  background:var(--card2);text-align:left;width:100%;border:2px solid transparent}
.sensi .se{font-size:20px;flex:none;line-height:1}
.st2{font-size:13.5px;font-weight:650}
.sensi.on{border-color:var(--prim);background:var(--prim-soft)}
.sensi.alerte.on{border-color:var(--amber);background:var(--amber-soft)}
.sensi.danger.on{border-color:var(--coral);background:rgba(240,83,63,.12)}
.histn{display:flex;flex-direction:column;gap:7px;margin-top:8px}
.histi{display:flex;align-items:center;gap:11px;padding:10px 13px;border-radius:14px;background:var(--card2)}
.histi .se{font-size:16px;flex:none}
.hx{flex:1;min-width:0}
.hx b{display:block;font-size:12.5px;font-weight:700}
.hx i{display:block;font-style:normal;font-size:11.5px;color:var(--dim);margin-top:2px;line-height:1.35}
.hd2{font-size:10.5px;color:var(--dim2);font-weight:650;flex:none}
.alr{margin-top:14px;padding:12px 14px;border-radius:16px;background:var(--amber-soft);
  color:var(--amber-ink);font-size:12px;font-weight:600;line-height:1.45}
.alr.grave{background:rgba(240,83,63,.13);color:var(--coral)}
.alerte.info{background:var(--prim-soft)}
.alerte.info .al-ic{color:var(--prim2)}

/* ── côtés gauche / droite ── */
.cotes{display:flex;gap:6px;margin-bottom:11px}
.cotb{flex:1;padding:10px;border-radius:13px;font-size:12px;font-weight:700;
  background:var(--card2);color:var(--dim);min-height:40px}
.cotb.on{background:var(--prim);color:#fff;box-shadow:0 4px 12px var(--ombre-prim)}
.st .cot{display:block;font-style:normal;text-decoration:none;font-size:8.5px;font-weight:800;
  opacity:.75;letter-spacing:.08em}
.dsq{margin-top:8px;padding:13px 15px;border-radius:16px;background:var(--amber-soft);
  color:var(--amber-ink);font-size:12.5px;font-weight:600;line-height:1.5}
.dsqi{margin-top:13px;padding:14px;border-radius:18px;background:var(--card2)}
.dsqn{font-size:13.5px;font-weight:750}
.dsqb{display:flex;gap:4px;margin-top:9px;height:30px}
.dsqg,.dsqd{display:flex;align-items:center;justify-content:center;border-radius:9px;
  font-size:11px;font-weight:800;color:#fff;background:var(--prim);min-width:30px}
.dsqd{background:var(--blue)}
.dsqg.fb,.dsqd.fb{background:var(--amber);color:#12203A}
.dsqt{font-size:11.5px;color:var(--dim);margin-top:7px;font-weight:600}

/* ── échauffement minuté ── */
.echh{display:flex;align-items:center;justify-content:space-between;gap:10px}
.echc{font-size:11px;font-weight:750;color:var(--dim2);background:var(--card2);
  padding:5px 10px;border-radius:999px;flex:none}
.echp{height:5px;border-radius:3px;background:var(--card2);margin-top:12px;overflow:hidden}
.echp i{display:block;height:100%;border-radius:3px;background:var(--prim);
  transition:width .45s var(--ease)}
.eche{margin-top:16px;padding:18px;border-radius:20px;background:var(--card2);text-align:center}
.echt{font-size:17px;font-weight:750;letter-spacing:-.02em;line-height:1.25}
.echd{font-size:12.5px;color:var(--dim);margin-top:7px;line-height:1.45}
.echm{font-size:48px;font-weight:800;letter-spacing:-.05em;margin:14px 0 4px;color:var(--prim2)}
/* dans le bloc gris, les boutons secondaires doivent ressortir */
.eche .btn{background:var(--card);box-shadow:var(--sh)}
.eche .btn.prim{background:linear-gradient(180deg,var(--prim3),var(--prim2));box-shadow:0 6px 18px var(--ombre-prim)}
.echp i{min-width:6px}

/* ── historique dans la fiche ── */
.histp{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.histpi{display:flex;align-items:baseline;justify-content:space-between;gap:10px;
  padding:10px 13px;border-radius:13px;background:var(--card2)}
.histpi.last{background:var(--prim-soft)}
.hpv{font-size:13.5px;font-weight:750}
.histpi.last .hpv{color:var(--prim2)}
.hpv u{text-decoration:none;font-size:8.5px;font-weight:800;letter-spacing:.08em;
  background:var(--amber);color:#12203A;padding:2px 5px;border-radius:5px;margin-left:7px;
  vertical-align:2px}
.hpd{font-size:11px;color:var(--dim2);font-weight:650;flex:none}
.hptot{margin-top:9px;padding:10px 13px;border-radius:14px;font-size:12px;font-weight:700}
.hptot.pos{background:var(--prim-soft);color:var(--prim2)}
.hptot.neg{background:var(--card2);color:var(--dim)}

/* ── installation ── */
.card.inst{border:1.5px solid var(--prim-soft)}
.inal{padding:11px 13px;border-radius:14px;background:var(--amber-soft);color:var(--amber-ink);
  font-size:12.5px;font-weight:700;line-height:1.4;margin-bottom:10px}
.pas{display:flex;flex-direction:column;gap:9px;margin-top:11px}
.pasi{display:flex;align-items:flex-start;gap:11px;padding:12px 13px;border-radius:15px;background:var(--card2)}
.pasi b{width:23px;height:23px;flex:none;border-radius:50%;background:var(--prim);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:800;margin-top:1px}
.pasi span{font-size:12.5px;line-height:1.45;font-weight:550}
.pasi span b{display:inline;width:auto;height:auto;background:none;color:var(--ink);
  font-weight:750;border-radius:0;margin:0}

/* ══ côté imposé sur un exercice unilatéral ══ */
.cote1{display:flex;flex-direction:column;gap:2px;margin:10px 0 2px;padding:9px 13px;
  border-radius:13px;background:var(--card2);border-left:3px solid var(--amber)}
.cote1.g{border-left-color:var(--prim)}
.cote1 b{font-size:13.5px;font-weight:750}
.cote1 i{font-style:normal;font-size:11.5px;color:var(--dim)}
.st .cot{display:block;font-size:8.5px;font-weight:800;opacity:.75;line-height:1;margin-bottom:1px}

/* ══ escalier du poids du corps ══ */
.marche{display:flex;align-items:center;gap:11px;width:100%;margin-top:9px;padding:11px 13px;
  border:none;border-radius:14px;cursor:pointer;text-align:left;
  background:linear-gradient(135deg,var(--amber-soft),var(--card2));
  box-shadow:inset 0 0 0 1px rgba(255,176,32,.35)}
.marche .m-ic{font-size:17px;flex:none;color:var(--amber)}
.marche .m-tx{display:flex;flex-direction:column;gap:2px;min-width:0}
.marche .m-tx b{font-size:13px;font-weight:750}
.marche .m-tx i{font-style:normal;font-size:11.5px;color:var(--dim);line-height:1.35}
.marche:active{transform:scale(.985)}
.escl{display:flex;flex-direction:column;gap:7px}
.esci{display:flex;align-items:flex-start;gap:10px;width:100%;padding:10px 12px;border:none;
  border-radius:12px;background:var(--card2);cursor:pointer;text-align:left;
  font-size:12.5px;font-weight:550;line-height:1.4;color:var(--ink)}
.esci b{width:21px;height:21px;flex:none;border-radius:50%;background:var(--line);color:var(--dim);
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800}
.esci.on{box-shadow:inset 0 0 0 2px var(--amber)}
.esci.on b{background:var(--amber);color:#1A1200}

/* ══ pause de la série ══ */
.gelb{display:flex;flex-direction:column;gap:5px;margin-top:16px;padding:13px 15px;border-radius:14px;
  background:var(--card2);text-align:left}
.gelb b{font-size:13.5px;font-weight:750}
.gelb i{font-style:normal;font-size:12px;color:var(--dim);line-height:1.5}

/* ══ mode voyage ══ */
.tgv{display:inline-flex;align-items:center;padding:7px 14px;border-radius:12px;
  background:var(--prim-soft);font-size:13px;font-weight:700;color:var(--prim)}
.alerte.voy{background:var(--prim-soft)}
.alerte.voy .al-ic{color:var(--prim)}
.tagl.voyage{background:var(--prim-soft);color:var(--prim)}
.wr.full{margin-top:10px;box-shadow:inset 0 0 0 1px var(--line)}
.wr.full .dot.off{background:var(--amber);opacity:.85}

/* ══ retrait de série et réserve ══ */
.abtn.moins{color:var(--dim)}
.btn.res{margin-top:12px;background:var(--amber-soft);color:var(--ink);font-weight:700;
  box-shadow:inset 0 0 0 1px rgba(255,176,32,.4)}

/* ══ palier franchi ══ */
.feu.pal{background:radial-gradient(circle at 50% 46%,#3A1A06 0%,#160B02 46%,#07070A 100%)}
.parts b{position:absolute;top:-14px;width:7px;height:11px;border-radius:2px;opacity:0;
  animation:tombe linear infinite}
@keyframes tombe{0%{opacity:0;transform:translateY(0) rotate(0)}
  10%{opacity:1}100%{opacity:0;transform:translateY(112vh) rotate(var(--rot,180deg))}}
.pal-lab{font-size:11.5px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;
  color:#FFD86B;opacity:.9;animation:pop .5s var(--ease) both}
.pal-arc{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:10px;
  font-size:13px;font-weight:700;animation:pop .5s var(--ease) .1s both}
.pal-arc .pal-av{opacity:.38;text-decoration:line-through}
.pal-arc em{font-style:normal;opacity:.5}
.pal-arc .pal-ap{color:#FFD86B}
.pal-halo{position:relative;margin-top:4px}
.pal-halo::before,.pal-halo::after{content:"";position:absolute;left:50%;top:50%;
  width:150px;height:150px;margin:-75px 0 0 -75px;border-radius:50%;
  border:2px solid rgba(255,216,107,.55);opacity:0;animation:onde2 2.2s var(--ease) .3s infinite}
.pal-halo::after{animation-delay:1.2s}
@keyframes onde2{0%{opacity:.85;transform:scale(.45)}100%{opacity:0;transform:scale(1.75)}}
.feu.pal .flamme.geante{animation:surgit .85s cubic-bezier(.18,1.3,.4,1) both}
@keyframes surgit{0%{transform:scale(.2) rotate(-18deg);opacity:0}
  55%{transform:scale(1.18) rotate(6deg);opacity:1}
  78%{transform:scale(.95) rotate(-2deg)}100%{transform:scale(1) rotate(0);opacity:1}}
.pal-nom{font-size:38px;font-weight:800;letter-spacing:-.03em;line-height:1.05;margin-top:2px;
  text-shadow:0 0 44px rgba(255,170,40,.65);animation:pop .6s var(--ease) .5s both}
.feu.pal .feu-j{margin-top:8px;animation:pop .55s var(--ease) .62s both}
.feu.pal .feu-s{animation:pop .55s var(--ease) .74s both}

/* ══ record personnel battu ══ */
.pr-fl{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 62px);
  z-index:70;pointer-events:none;display:flex;align-items:center;gap:12px;
  padding:13px 16px;border-radius:18px;color:#1A1200;
  background:linear-gradient(135deg,#FFD86B,#FFB020);
  box-shadow:0 14px 34px rgba(240,140,20,.42);
  animation:prIn .45s cubic-bezier(.18,1.3,.4,1) both, prOut .45s ease 2.3s both}
@keyframes prIn{0%{opacity:0;transform:translateY(-22px) scale(.9)}
  100%{opacity:1;transform:translateY(0) scale(1)}}
@keyframes prOut{to{opacity:0;transform:translateY(-16px) scale(.96)}}
.pr-ic{position:relative;width:38px;height:38px;flex:none;border-radius:50%;
  background:rgba(255,255,255,.55);display:flex;align-items:center;justify-content:center;
  font-size:19px}
.pr-ic::after{content:"";position:absolute;inset:-6px;border-radius:50%;
  border:2px solid rgba(255,255,255,.85);opacity:0;animation:onde2 1.4s var(--ease) .15s infinite}
.pr-tx{min-width:0;display:flex;flex-direction:column;gap:2px}
.pr-t1{font-size:13.5px;font-weight:850;letter-spacing:.01em}
.pr-t2{font-size:11.5px;font-weight:650;opacity:.78;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pr-t3{font-size:12.5px;font-weight:800}
.pr-t3 s{opacity:.5;font-weight:650}
.pr-t3 em{font-style:normal;opacity:.55;margin:0 6px}

/* ══ messages courts ══ */
.toast{position:fixed;left:14px;right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 104px);
  z-index:72;pointer-events:none;padding:12px 16px;border-radius:15px;
  background:rgba(22,26,33,.94);color:#F2F5F9;font-size:13px;font-weight:600;line-height:1.4;
  box-shadow:0 12px 30px rgba(0,0,0,.28);text-align:center;
  animation:tostIn .32s var(--ease) both, tostOut .4s ease 3s both}
@keyframes tostIn{0%{opacity:0;transform:translateY(14px)}100%{opacity:1;transform:translateY(0)}}
@keyframes tostOut{to{opacity:0;transform:translateY(10px)}}

/* ══ icônes de palier : animations par parties ══
   Les animations SVG se recalculent sur le processeur à chaque image : en boucle
   infinie, la seule flamme de l'accueil occupait un quart du processeur d'un
   téléphone, et l'écran des seize paliers les trois quarts, d'où les gels. Elles
   jouent donc quelques tours à l'affichage puis s'arrêtent ; la flamme garde une
   respiration lente, portée par la carte graphique (transform sur un élément HTML). */
.fl{display:block;overflow:visible}
.fl .dz,.fl .dzi,.fl .dzc,.fl .sp,.fl .lueur,.fl .eti,.fl .frappe,.fl .tourb,.fl .jet,.fl .gte,.fl .file,.fl .queue,.fl .scint,.fl .glint,.fl .rayons,.fl .disque{transform-box:fill-box}
.fl .dz{transform-origin:50% 100%;animation:dz 1.7s ease-in-out var(--fl-it,2)}
.fl .dz.d2{animation-duration:1.45s;animation-delay:-.4s}
.fl .dz.d3{animation-duration:1.9s;animation-delay:-.9s}
.fl .dz.lent{animation-duration:2.6s}
.fl .dz.sway{animation-name:sway;animation-duration:2.4s}
.fl .dzi{transform-origin:50% 100%;animation:dzi 1.05s ease-in-out var(--fl-it,2)}
.fl .dzc{transform-origin:50% 100%;animation:dzi .8s ease-in-out var(--fl-it,2) reverse}
@keyframes dz{0%,100%{transform:scale(1,1) skewX(0)}
  25%{transform:scale(.95,1.06) skewX(-3deg)}
  52%{transform:scale(1.04,.96) skewX(2.5deg)}
  78%{transform:scale(.98,1.03) skewX(-1deg)}}
@keyframes dzi{0%,100%{transform:scale(1,1)}45%{transform:scale(.9,1.1)}72%{transform:scale(1.06,.94)}}
@keyframes sway{0%,100%{transform:rotate(-3deg) scale(1,1)}50%{transform:rotate(3deg) scale(.96,1.05)}}
.fl .sp{opacity:0;transform-origin:50% 50%;animation:sp 2.6s ease-out var(--fl-it,2)}
@keyframes sp{0%{opacity:0;transform:translateY(6px) scale(.5)}
  20%{opacity:1}100%{opacity:0;transform:translateY(-16px) scale(.2)}}
.fl .lueur{transform-origin:50% 50%;animation:lueur 2.4s ease-in-out var(--fl-it,2)}
@keyframes lueur{0%,100%{opacity:.55;transform:scale(.92)}50%{opacity:1;transform:scale(1.08)}}
.fl .eti{transform-origin:50% 100%;animation:eti 2.2s ease-in-out var(--fl-it,2)}
@keyframes eti{0%{opacity:0;transform:translateY(10px) scale(.4)}
  30%{opacity:1;transform:translateY(0) scale(1)}70%{opacity:1;transform:translateY(-3px) scale(.9)}
  100%{opacity:0;transform:translateY(-9px) scale(.3)}}
.fl .frappe{transform-origin:50% 100%;opacity:0;animation:frappe 1.6s ease-out var(--fl-it,2)}
@keyframes frappe{0%,62%{opacity:0;transform:scale(.4)}68%{opacity:1;transform:scale(1)}
  100%{opacity:0;transform:scale(1.35)}}
.fl .tourb{transform-origin:50% 80%;animation:tourb 2.8s ease-in-out var(--fl-it,2)}
@keyframes tourb{0%,100%{transform:rotate(-6deg) scale(1)}50%{transform:rotate(7deg) scale(1.05,.97)}}
.fl .jet{transform-origin:50% 100%;animation:jet 1.3s ease-in-out var(--fl-it,2)}
.fl .jet.j2{animation-duration:.9s}
.fl .jet.j3{transform-origin:50% 100%;animation-duration:1.7s;animation-delay:-.5s}
@keyframes jet{0%,100%{transform:scale(.8,.75)}50%{transform:scale(1.08,1.12)}}
.fl .coul{animation:coul 2.2s ease-in-out var(--fl-it,2)}
.fl .coul.c2{animation-delay:-1.1s}
@keyframes coul{0%,100%{opacity:.75}50%{opacity:1}}
.fl .gte{opacity:0;animation:gt1 1.6s cubic-bezier(.3,.6,.6,1) var(--fl-it,2)}
.fl .k2{animation-name:gt2;animation-delay:.5s}
.fl .k3{animation-name:gt3;animation-delay:1s}
.fl .k4{animation-name:gt1;animation-delay:.25s;animation-duration:1.9s}
.fl .k5{animation-name:gt2;animation-delay:.8s;animation-duration:1.4s}
.fl .k6{animation-name:gt3;animation-delay:1.25s;animation-duration:1.8s}
@keyframes gt1{0%{opacity:0;transform:translate(0,4px)}15%{opacity:1}
  50%{transform:translate(-8px,-8px)}100%{opacity:0;transform:translate(-14px,6px)}}
@keyframes gt2{0%{opacity:0;transform:translate(0,4px)}15%{opacity:1}
  50%{transform:translate(9px,-9px)}100%{opacity:0;transform:translate(15px,6px)}}
@keyframes gt3{0%{opacity:0;transform:translate(0,4px)}15%{opacity:1}
  50%{transform:translate(1px,-12px)}100%{opacity:0;transform:translate(3px,2px)}}
.fl .file{transform-origin:30% 70%;animation:file 3.2s ease-in-out var(--fl-it,2)}
@keyframes file{0%,100%{transform:translate(0,0)}50%{transform:translate(2px,-2px)}}
.fl .queue{transform-origin:0% 100%;animation:queue 1.2s ease-in-out var(--fl-it,2)}
.fl .queue.q2{animation-duration:.85s;animation-delay:-.3s}
@keyframes queue{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.92);opacity:.8}}
.fl .scint{transform-origin:50% 50%;animation:scint 2.6s ease-in-out var(--fl-it,2)}
@keyframes scint{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.08) rotate(8deg)}}
.fl .glint{transform-origin:50% 50%;opacity:0;animation:glint 2.6s ease-in-out var(--fl-it,2)}
.fl .glint.gl2{animation-delay:1.3s}
@keyframes glint{0%,100%{opacity:0;transform:scale(.3)}50%{opacity:1;transform:scale(1.1)}}
.fl .rayons{transform-origin:50% 50%;animation:rayons 9s cubic-bezier(.3,.6,.4,1) 1}
@keyframes rayons{to{transform:rotate(360deg)}}
.fl .disque{transform-origin:50% 50%;animation:disque 3s ease-in-out var(--fl-it,2)}
@keyframes disque{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
/* figée : palier pas encore atteint, série en veille ou en pause */
.fl.fige *{animation:none!important}
.fl.fige .sp,.fl.fige .gte,.fl.fige .frappe,.fl.fige .glint,.fl.fige .eti{opacity:0}
@media(prefers-reduced-motion:reduce){.fl *{animation:none!important}
  .fl .sp,.fl .gte,.fl .frappe{opacity:0}}

/* ════════════════ REFONTE v18 ════════════════
   Surfaces plates, filet fin au lieu des ombres en série, rayons selon la
   hiérarchie (carte principale 28, cartes 20, lignes 14, pastilles rondes).
   Une seule chose chaude et animée à l'écran : la flamme. */

/* ── carte de série : l'élément fort de l'accueil ── */
.streak{display:block;width:100%;margin-top:6px;padding:18px 18px 16px;text-align:left;border:none;
  border-radius:var(--r1);background:var(--card);box-shadow:var(--sh);position:relative;overflow:hidden;cursor:pointer}
.streak::before{content:"";position:absolute;left:-30px;top:-40px;width:200px;height:200px;border-radius:50%;
  background:radial-gradient(circle,var(--braise-soft),transparent 70%);pointer-events:none}
.sk-haut{display:flex;align-items:center;gap:14px;position:relative}
.streak .flamme{width:84px;height:84px;flex:none}
.flamme .fl{width:100%;height:100%}
.sk-txt{flex:1;min-width:0}
.sk-n{display:flex;align-items:flex-end;gap:8px}
.sk-n b{font-family:var(--disp);font-weight:700;font-size:62px;line-height:.8;letter-spacing:-.01em}
.sk-n span{font-size:12.5px;font-weight:600;color:var(--dim);line-height:1.2;padding-bottom:1px}
.sk-pal{font-family:var(--disp);font-size:21px;color:var(--braise-ink);margin-top:9px;line-height:1}
.sk-max{flex:none;align-self:flex-start;text-align:right;font-size:11.5px;font-weight:600;color:var(--dim2)}
.sk-max b{display:block;font-family:var(--disp);font-size:24px;color:var(--ink);line-height:1;margin-bottom:2px}
.sk-bar{position:relative;height:6px;margin-top:16px;border-radius:3px;background:var(--card2);overflow:hidden}
.sk-bar i{display:block;height:100%;border-radius:3px;
  background:linear-gradient(90deg,var(--braise1),var(--braise2) 60%,var(--braise3));animation:grow .9s var(--ease) both}
.sk-bas{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-top:9px;position:relative}
.sk-e{font-size:13px;font-weight:650;color:var(--ink)}
.sk-s{font-size:12px;font-weight:550;color:var(--dim);text-align:right}
/* séance du jour pas encore faite : la flamme attend, elle ne danse pas */
.streak.todo .fl{filter:saturate(.45);opacity:.78}
.streak.todo .fl *{animation-play-state:paused}
.streak.todo .sk-e{color:var(--braise-ink)}
.streak.fait .sk-e{color:var(--prim2)}
.streak.gel .fl{filter:grayscale(.8) brightness(1.05);opacity:.6}
.streak.gel .fl *{animation-play-state:paused}
.streak.gel .sk-bar i{background:var(--dim2)}

/* ── grandes flammes : bilan, fête, palier ── */
.flamme{position:relative}
.flamme.grand{width:112px;height:112px;margin:0 auto;animation:entree .6s var(--ease) both}
.flamme.geante{width:200px;height:200px;margin:0 auto;border-radius:0;background:none;animation:entree .7s var(--ease) both}
.flamme.geante::before{content:"";position:absolute;inset:-30px;border-radius:50%;
  background:radial-gradient(circle at 50% 58%,rgba(255,150,40,.42),transparent 64%);animation:halo 2.6s ease-in-out 3}
.flamme.geante .fl{width:200px;height:200px;position:relative}
@keyframes halo{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.1)}}
@keyframes entree{0%{transform:scale(.3) rotate(-14deg);opacity:0}
  60%{transform:scale(1.1) rotate(4deg)}100%{transform:scale(1) rotate(0);opacity:1}}
@keyframes onde{0%{opacity:.7;transform:scale(.8)}100%{opacity:0;transform:scale(1.9)}}
.feu-n,.pal-nom{font-family:var(--disp);font-weight:700;letter-spacing:0}
.feu-n{font-size:110px}
.pal-nom{font-size:46px}
.feu-p{text-transform:none;letter-spacing:0;font-size:14px}
.pal-lab{text-transform:none;letter-spacing:0;font-size:14px}
b.pal{color:var(--braise-ink)}
.feu.pal{color:#fff}

/* ── carte de la séance du jour ── */
.hero{margin-top:12px;border-radius:var(--r1);overflow:hidden;position:relative;
  background:var(--card);box-shadow:var(--sh);color:var(--ink)}
.hero::after{display:none}
[data-theme="sombre"] .hero{background:var(--card);box-shadow:var(--sh)}
.hero.rest{background:var(--card);box-shadow:var(--sh)}
.hero-in{padding:18px 18px 16px;position:relative}
.hero-lab{font-size:12.5px;font-weight:650;color:var(--prim2);margin-bottom:6px}
.hero-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-wrap:wrap}
.hero h2{font-family:var(--disp);font-size:32px;font-weight:700;line-height:.98;letter-spacing:0;color:var(--ink)}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;font-size:12.5px;color:var(--dim);font-weight:600}
.meta span{padding:5px 10px;border-radius:999px;background:var(--card2)}
.meta span.cour{background:var(--amber-soft);color:var(--amber-ink)}
.meta b{color:var(--ink)}
.tip{margin-top:12px;padding:12px 0 0;border-top:1px solid var(--line);font-size:12.5px;line-height:1.5;
  color:var(--dim);background:none;border-radius:0}
.go{display:flex;flex-direction:column;align-items:center;gap:2px;width:calc(100% - 32px);margin:0 16px 16px;
  padding:16px;border-radius:18px;font-size:16px;font-weight:700;color:#fff;background:var(--prim);box-shadow:none}
.go small{font-size:11.5px;font-weight:600;opacity:.85}
.go.haut{width:100%;margin:16px 0 0}
[data-theme="sombre"] .go{color:#04140E}
.go.alt{background:var(--card2);color:var(--ink)}
.hero-pied{display:flex;justify-content:center;margin-top:6px}
.chrono-btn{margin:0;padding:9px 12px;border-radius:999px;font-size:12.5px;font-weight:650;
  background:none;color:var(--dim)}
.tipm{color:var(--amber-ink);background:var(--amber-soft)}
.pbar{background:var(--card2)}
.pbar i{background:var(--prim)}
.quit{background:var(--card2);color:var(--ink)}
.tg{background:var(--card2)}
.tg button{color:var(--dim)}
.tg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(14,21,32,.12)}
[data-theme="sombre"] .tg button.on{background:#2A3546;box-shadow:none}
.tg.large{box-shadow:none}
.tgv{background:var(--prim-soft);color:var(--prim2)}

/* ── titres ── */
.sec{margin:28px 2px 10px;font-size:15px;font-weight:700;color:var(--ink);text-transform:none;letter-spacing:-.01em}
.h2,.titre{font-family:var(--disp);font-size:30px;font-weight:700;letter-spacing:0;line-height:1;margin:22px 0 14px}
.sh1{font-family:var(--disp);font-size:28px;font-weight:700;letter-spacing:0;line-height:1.02}
.back{background:var(--card);color:var(--ink);box-shadow:var(--sh);margin-top:8px}

/* ── semaine et autres séances ── */
.week{background:var(--card);border-radius:var(--r2);box-shadow:var(--sh);overflow:hidden}
.wr{display:flex;align-items:center;gap:12px;padding:15px 16px;font-size:14px;width:100%;min-height:54px;
  border-bottom:1px solid var(--line);background:none;text-align:left;position:relative}
.wr:last-child{border-bottom:none}
.wr.auj{background:var(--prim-soft)}
.wr.auj::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--prim)}
.wr b{font-weight:650;min-width:78px;flex:none}
.wr i{font-style:normal;color:var(--dim);font-size:13px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wr.full{margin-top:0;box-shadow:none}
.dot{width:9px;height:9px;border-radius:50%;background:var(--line);flex:none}
.dot.ok{background:var(--prim);box-shadow:0 0 0 4px var(--prim-soft)}
.dot.off{background:transparent;border:1.5px solid var(--dim2)}
.dot.hc{background:var(--braise2)}
.dot.hc.v{background:var(--blue)}
.wr.full .dot.off{opacity:1}
.tagl{font-size:11px;font-weight:650;padding:4px 9px;border-radius:999px;text-transform:none;letter-spacing:0}
.tagl.salle{background:var(--prim-soft);color:var(--prim2)}
.tagl.maison{background:var(--card2);color:var(--dim)}
.tagl.voyage{background:rgba(46,124,246,.12);color:var(--blue)}

/* ── encarts ── */
.als{margin-top:4px}
.alerte{display:flex;align-items:center;gap:13px;width:100%;margin-top:10px;padding:13px 14px;border-radius:var(--r2);
  background:var(--card);box-shadow:var(--sh);text-align:left;color:var(--ink);font:inherit}
.al-ic{width:38px;height:38px;flex:none;border-radius:12px;background:var(--amber-soft);display:flex;
  align-items:center;justify-content:center;font-size:17px;font-weight:800;color:var(--amber-ink);font-style:normal}
.al-ic svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.al-tx b{display:block;font-size:14px;font-weight:700;color:var(--ink)}
.al-tx i{font-style:normal;display:block;font-size:12px;color:var(--dim);margin-top:2px;line-height:1.4}
.alerte.photo .al-ic{background:var(--card2)}
.alerte.cyc{background:var(--amber-soft);box-shadow:none}
.alerte.cyc .al-ic{background:var(--card);color:var(--amber-ink)}
.alerte.cyc.dl{background:var(--card);box-shadow:inset 0 0 0 1.5px var(--amber)}
.alerte.cyc.dl .al-ic{background:var(--amber-soft)}
.alerte.voy{background:rgba(46,124,246,.10);box-shadow:none}
.alerte.voy .al-ic{background:var(--card);color:var(--blue)}

/* ── navigation ── */
.nav{position:fixed;bottom:calc(12px + env(safe-area-inset-bottom));left:12px;right:12px;max-width:496px;margin:0 auto;
  display:flex;z-index:30;border-radius:22px;padding:6px;
  background:color-mix(in srgb,var(--card) 90%,transparent);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
  box-shadow:var(--sh2)}
.nav button{flex:1;padding:8px 2px 7px;background:none;font-size:10.5px;font-weight:600;color:var(--dim2);
  display:flex;flex-direction:column;align-items:center;gap:4px;border-radius:16px;min-width:0}
.nav em{display:block;width:23px;height:23px;font-style:normal}
.nav svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button.on{color:var(--prim2);background:var(--prim-soft)}
.nav button.on em{transform:none}

/* ── cartes, boutons, champs ── */
.card{border-radius:var(--r2);box-shadow:var(--sh)}
.ex{border-radius:var(--r2);box-shadow:var(--sh)}
.ex.now{box-shadow:0 0 0 2px var(--prim)}
[data-theme="sombre"] .ex.now{box-shadow:0 0 0 2px var(--prim)}
.exn{font-size:16px}
.exo{background:var(--prim-soft);color:var(--prim2)}
.st.cur{background:var(--prim);color:#fff;box-shadow:none}
[data-theme="sombre"] .st.cur{color:#04140E}
.st.done{background:var(--ink);color:var(--bg)}
[data-theme="sombre"] .st.done{background:#2A3546;color:var(--ink);box-shadow:none}
.st.pr{background:var(--braise1);color:#2A1500;box-shadow:none}
.abtn{border-radius:12px}
.btn{border-radius:16px;font-weight:650}
.btn.prim{background:var(--prim);color:#fff;box-shadow:none}
[data-theme="sombre"] .btn.prim{color:#04140E}
.btn.dg{box-shadow:none}
.okb{background:var(--prim);box-shadow:none;border-radius:18px}
[data-theme="sombre"] .okb{color:#04140E}
.okb:disabled{background:var(--card2);color:var(--dim2)}
.tb.go2{background:var(--prim);box-shadow:none}
[data-theme="sombre"] .tb.go2{color:#04140E}
.pad{border-radius:26px 26px 0 0;box-shadow:0 -1px 0 var(--line),0 -18px 40px -20px rgba(14,21,32,.35)}
[data-theme="sombre"] .pad{box-shadow:0 -1px 0 var(--line),0 -18px 40px -16px rgba(0,0,0,.8)}
.val,.big,.echm,.stat b,.tstv,.estim b{font-family:var(--disp);font-weight:700;letter-spacing:0}
.val{font-size:32px}
.big{font-size:58px}
.stat b{font-size:30px}
.fld small,.g2 label,.vlab,.mlab,.lk,.bet,.tstv i{text-transform:none;letter-spacing:0;font-size:11.5px;font-weight:650}
.stp{box-shadow:none;background:var(--card);border:1px solid var(--line)}
.tm{background:var(--navy)}
.bar{background:var(--prim)}
.sheet{border-radius:26px 26px 0 0}
.sel{box-shadow:var(--sh)}
.chip{background:var(--card)}
.pali{box-shadow:none}
.rs button.on,.tpsi.on,.cotb.on{box-shadow:none}
.mtrack i.ok{background:var(--prim)}
.mtrack i.hi{background:var(--amber)}

/* ── Ton évolution ── */
.evo-tete{position:relative;margin-top:4px;padding:22px 18px 18px;border-radius:var(--r1);background:var(--card);
  box-shadow:var(--sh);text-align:center;overflow:hidden}
.evo-tete::before{content:"";position:absolute;left:50%;top:-40px;width:280px;height:280px;margin-left:-140px;border-radius:50%;
  background:radial-gradient(circle,var(--braise-soft),transparent 68%);pointer-events:none}
.flamme.evo{width:150px;height:150px;margin:0 auto}
.evo-n{position:relative;font-size:14px;font-weight:600;color:var(--dim);margin-top:8px}
.evo-n b{font-family:var(--disp);font-size:44px;color:var(--ink);vertical-align:-3px;margin-right:4px}
.evo-pal{position:relative;font-family:var(--disp);font-size:26px;color:var(--braise-ink);margin-top:4px}
.evo-s{position:relative;display:flex;justify-content:space-between;gap:10px;margin-top:9px;font-size:12px;color:var(--dim);font-weight:600}
.evo-tete.gel .fl{filter:grayscale(.8);opacity:.6}
.gelb{margin-top:12px;padding:15px 16px;border-radius:var(--r2);background:var(--card);box-shadow:var(--sh)}
.gelb .btn{margin-top:10px}
.evo-g{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.evo-t{display:flex;flex-direction:column;align-items:center;text-align:center;gap:3px;padding:14px 10px 13px;
  border-radius:var(--r2);background:var(--card);box-shadow:var(--sh)}
.evo-ic{width:72px;height:72px;margin-bottom:4px}
.evo-ic .fl{width:100%;height:100%}
.evo-t b{font-family:var(--disp);font-size:19px;font-weight:700;line-height:1.05}
.evo-j{font-size:12px;font-weight:600;color:var(--dim)}
.evo-e{font-size:11.5px;font-weight:650;color:var(--prim2)}
.evo-t.cur{background:var(--braise-soft);box-shadow:inset 0 0 0 2px var(--braise2)}
.evo-t.cur .evo-e{color:var(--braise-ink)}
.evo-t.lock .evo-ic{filter:grayscale(1);opacity:.32}
.evo-t.lock b{color:var(--dim)}
.evo-t.lock .evo-e{color:var(--dim2)}
@media(min-width:440px){.evo-g{grid-template-columns:repeat(3,1fr)}}

/* ── petits écrans (320–379 px) ── */
.sk-rec{display:none}
@media(max-width:379px){
  .streak .flamme{width:66px;height:66px}
  .sk-n b{font-size:50px}
  .sk-max{display:none}
  .sk-rec{display:block;font-family:var(--txt);font-size:11.5px;font-weight:600;color:var(--dim2);margin-top:4px}
  .sk-bas{flex-direction:column;align-items:flex-start;gap:2px}
  .sk-s{text-align:left}
  .cy-t{font-size:11px}
  .cy-seg i{width:7px}
  .hd h1{font-size:21px}
  .nav{left:8px;right:8px;padding:5px}
  .nav button{font-size:9.5px;letter-spacing:-.02em;overflow:hidden}
  .hero h2{font-size:28px}
}

/* ════════════════ SÉLECTEURS DE CHARGE (v21) ════════════════ */
.chg{margin-bottom:10px;border-radius:22px;background:var(--card2);padding:12px;position:relative}
.chg-val,.br-tot,.ht-val{display:flex;align-items:baseline;gap:5px;flex-wrap:wrap}
.chg-val b,.br-tot b,.ht-val b{font-family:var(--disp);font-size:38px;font-weight:700;line-height:1;color:var(--ink);letter-spacing:0}
.chg-val span,.br-tot span,.ht-val span{font-size:15px;font-weight:700;color:var(--dim)}
.chg-val i,.br-tot i,.ht-val i{flex-basis:100%;font-style:normal;font-size:12px;font-weight:600;color:var(--dim);margin-top:3px;line-height:1.35}
.bump{animation:bump .3s var(--ease)}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.07)}100%{transform:scale(1)}}
.okb small{display:block;font-size:12px;font-weight:600;opacity:.85;margin-top:2px}
.chg-pied{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-top:6px}
.chg-pied>div:first-child{flex:1;min-width:0}
.rp{flex:none;text-align:center}
.rp small{display:block;font-size:11px;font-weight:650;color:var(--dim2);margin-bottom:4px}
.rpr{display:flex;align-items:center;gap:6px}
.rpr .stp{width:40px;height:40px;border-radius:13px;font-size:21px;box-shadow:none;border:1px solid var(--line);background:var(--card)}
.rpr .val{font-size:28px;min-width:30px;text-align:center}
.lien.vider{display:block;padding:6px 0 0;font-size:12px;color:var(--dim2)}
.lien.vider:disabled{visibility:hidden}

/* ── pile de poids ── */
.chg.pile{display:flex;gap:14px;align-items:stretch}
.pile-cadre{flex:0 0 52%;position:relative;border-radius:16px;padding:10px 8px 8px;
  background:linear-gradient(180deg,#1C222B,#11161D);box-shadow:inset 0 0 0 1px rgba(255,255,255,.06),0 6px 16px -10px rgba(0,0,0,.6)}
.pile-tete{position:absolute;left:0;right:0;top:0;height:10px;display:flex;justify-content:center;pointer-events:none;z-index:2}
.pile-tete i{width:3px;height:14px;margin-top:-4px;background:linear-gradient(90deg,#8F98A6,#D7DCE3,#8F98A6);border-radius:2px}
.pile-col{position:relative;height:172px;overflow-y:auto;overscroll-behavior:contain;scroll-snap-type:y proximity;
  display:flex;flex-direction:column;gap:3px;padding:2px 10px;scrollbar-width:none;
  /* les deux tiges guides, de part et d'autre */
  background:linear-gradient(90deg,transparent 3px,#7E8794 3px,#C3C9D2 4.5px,#7E8794 6px,transparent 6px) left/10px 100% no-repeat local,
             linear-gradient(90deg,transparent 4px,#7E8794 4px,#C3C9D2 5.5px,#7E8794 7px,transparent 7px) right/10px 100% no-repeat local;
  -webkit-mask-image:linear-gradient(180deg,transparent,#000 14px,#000 calc(100% - 14px),transparent);
          mask-image:linear-gradient(180deg,transparent,#000 14px,#000 calc(100% - 14px),transparent)}
.pile-col::-webkit-scrollbar{display:none}
.pl-r{flex:none;position:relative;display:flex;align-items:center;justify-content:flex-end;height:30px;padding:0 10px;
  border-radius:5px;background:linear-gradient(180deg,#4A5361 0%,#343B46 55%,#272D36 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),inset 0 -1px 0 rgba(0,0,0,.35);
  color:#DCE2EA;font-size:13px;font-weight:750;scroll-snap-align:center;font-variant-numeric:tabular-nums;
  transition:background .2s ease,color .2s ease,box-shadow .2s ease}
.pl-r span{position:relative;z-index:1}
/* trou central où passe la tige du sélecteur */
.pl-trou{position:absolute;left:50%;top:50%;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;
  background:#12161C;box-shadow:inset 0 1px 2px rgba(0,0,0,.8),0 0 0 1px rgba(255,255,255,.08)}
/* plaques soulevées avec la goupille */
.pl-r.lev{background:linear-gradient(180deg,#5C6676 0%,#465060 55%,#38404D 100%);color:#F2F5F9}
.pl-r.lev::after{content:"";position:absolute;inset:0;border-radius:5px;
  background:linear-gradient(90deg,color-mix(in srgb,var(--prim) 22%,transparent),transparent 70%);pointer-events:none}
.pl-r.on{background:linear-gradient(180deg,color-mix(in srgb,var(--prim) 70%,#fff 10%) 0%,var(--prim) 60%,color-mix(in srgb,var(--prim) 80%,#000) 100%);
  color:#fff;box-shadow:0 0 0 2px color-mix(in srgb,var(--prim) 45%,transparent),0 6px 14px -6px var(--prim)}
[data-theme="sombre"] .pl-r.on{color:#04140E}
/* la goupille : tige qui traverse la plaque, bouton rond à gauche */
.pl-pin{display:none}
.pl-r.on .pl-pin{display:block;position:absolute;left:-12px;top:50%;width:calc(50% + 12px);height:4px;margin-top:-2px;border-radius:2px;
  background:linear-gradient(180deg,#F3F5F8,#9AA3B0);z-index:2;animation:pin .28s var(--ease)}
.pl-r.on .pl-pin::before{content:"";position:absolute;left:-2px;top:50%;width:14px;height:14px;margin-top:-7px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#FFD27A,#F08A24 60%,#B9580E);box-shadow:0 1px 3px rgba(0,0,0,.5)}
@keyframes pin{from{transform:translateX(-14px);opacity:0}to{transform:none;opacity:1}}
.pl-r:active{transform:scale(.98)}
.chg.pile .chg-val{flex:1;min-width:0;align-content:center}
.chg.pile .chg-val .rp{margin-top:14px;text-align:left}

/* ── barre chargée ── */
.br-vis{margin:-2px -4px 0}
.br-svg{display:block;width:100%;height:auto;overflow:visible}
.br-svg .dqb{cursor:pointer}
.br-svg .dqb:active{opacity:.75}
.br-svg .neuf.d{animation:dqD .32s var(--ease)}
.br-svg .neuf.g{animation:dqG .32s var(--ease)}
@keyframes dqD{from{transform:translateX(26px);opacity:0}to{transform:none;opacity:1}}
@keyframes dqG{from{transform:translateX(-26px);opacity:0}to{transform:none;opacity:1}}
.br-lab{font-size:9.5px;font-weight:650;fill:var(--dim2)}
.br-dq{display:grid;grid-template-columns:repeat(var(--n,7),minmax(0,1fr));gap:2px;margin-top:10px;
  padding:8px 4px;border-radius:16px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line)}
.dqa{display:flex;align-items:center;justify-content:center;min-height:50px;padding:0;background:none;border-radius:12px}
.dqa:active{background:var(--card2)}
/* disque vu de face : couleur, anneau, moyeu */
.dqf{display:flex;align-items:center;justify-content:center;border-radius:50%;font-size:11.5px;font-weight:800;letter-spacing:-.02em;
  box-shadow:inset 0 0 0 3px rgba(0,0,0,.14),inset 0 0 0 6px rgba(255,255,255,.12),0 2px 5px -2px rgba(0,0,0,.45);
  transition:transform .15s var(--ease)}
.dqa:active .dqf{transform:scale(.9)}
.dqf.pt{font-size:10px;letter-spacing:-.04em}

/* ── haltères ── */
.ht-zone{display:flex;align-items:center;justify-content:space-between;gap:4px;height:96px;touch-action:pan-y;
  user-select:none;-webkit-user-select:none;cursor:ew-resize;border-radius:18px;
  background:radial-gradient(ellipse 60% 70% at 50% 50%,var(--card),transparent 75%)}
.ht-fl{flex:none;width:40px;height:40px;border-radius:50%;background:var(--card);color:var(--ink);font-size:22px;
  font-weight:600;box-shadow:inset 0 0 0 1px var(--line);line-height:1}
.ht-vis{flex:1;display:flex;align-items:center;justify-content:center;height:100%;pointer-events:none}
.ht-svg{width:100%;max-width:250px;height:auto;overflow:visible}
.ht-svg .hf-t{transform-box:fill-box;transition:transform .28s cubic-bezier(.2,1.4,.4,1)}
.ht-svg .hf-t.g{transform-origin:100% 50%}
.ht-svg .hf-t.d{transform-origin:0% 50%}
.ht-grav{font-size:15px;font-weight:800;fill:rgba(255,255,255,.55);font-family:var(--disp)}
/* la réglette : la charge choisie au centre, les voisines s'estompent */
.ht-reg{position:relative;display:flex;gap:2px;overflow-x:auto;margin:6px -12px 0;padding:4px 40%;scroll-snap-type:x proximity;
  scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,transparent,#000 22%,#000 78%,transparent);
  mask-image:linear-gradient(90deg,transparent,#000 22%,#000 78%,transparent)}
.ht-reg::-webkit-scrollbar{display:none}
.htc{flex:none;min-width:44px;height:40px;padding:0 6px;border-radius:12px;background:none;font-size:15px;font-weight:700;
  color:var(--dim2);scroll-snap-align:center;transition:color .2s ease,transform .2s var(--ease),background .2s ease}
.htc.on{color:#fff;background:var(--prim);transform:scale(1.08)}
[data-theme="sombre"] .htc.on{color:#04140E}
.ht-val{align-items:baseline}
.lbl1{display:block;margin-top:10px;font-size:11.5px;font-weight:650;color:var(--dim2)}
@media(prefers-reduced-motion:reduce){.bump,.pl-r.on .pl-pin,.br-svg .neuf{animation:none}.ht-svg .hf-t{transition:none}}

/* ════════════════ ALLÈGEMENT (v20) ════════════════ */
#app{padding-top:calc(env(safe-area-inset-top,0px) + 14px)}
/* série : chiffre, palier, une ligne */
.streak{margin-top:0;padding:16px 18px 14px}
.streak .flamme{width:72px;height:72px}
.sk-n b{font-size:56px}
.sk-n span{font-size:15px;font-weight:650;padding-bottom:4px}
.sk-pal{font-size:20px;margin-top:6px}
.sk-bar{margin-top:14px;height:5px}
.sk-bas{margin-top:8px}
.sk-s{text-align:left;font-size:12.5px}
.sk-e{font-size:12.5px}
/* encarts sur une ligne, sans pictogramme */
.alerte{padding:12px 16px}
.alerte.cyc .al-tx,.alerte.voy .al-tx{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px}
.alerte.cyc .al-tx i,.alerte.voy .al-tx i{margin:0}
/* séance du jour */
.hero{margin-top:12px}
.hero-in{padding:18px}
.meta{margin-top:10px}
.meta span{padding:0;background:none;font-size:13px}
.meta span+span::before{content:"";display:inline-block;width:3px;height:3px;border-radius:50%;background:var(--dim2);
  margin:0 8px 3px 0;vertical-align:middle}
.meta span.cour{background:none;color:var(--amber-ink)}
.go.haut{margin-top:14px}
.hero-pied{margin-top:4px}
/* la semaine sur une ligne */
.sem{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:22px}
.sj{display:flex;flex-direction:column;align-items:center;gap:7px;padding:10px 0 11px;border-radius:14px;background:var(--card);
  box-shadow:var(--sh);min-height:56px}
.sj b{font-size:13px;font-weight:700;color:var(--ink)}
.sj i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.sj.ok i{background:var(--prim)}
.sj.rep{background:transparent;box-shadow:none}
.sj.rep b{color:var(--dim2);font-weight:600}
.sj.rep i{background:transparent}
.sj.auj{box-shadow:inset 0 0 0 2px var(--prim)}
.sj.auj b{color:var(--prim2)}
.autres{display:flex;justify-content:center;flex-wrap:wrap;gap:4px 18px;margin-top:16px}
.lien{background:none;padding:8px 4px;font-size:13px;font-weight:650;color:var(--dim)}
.lien:active{color:var(--ink)}
/* séance en cours */
.shd{display:flex;align-items:center;gap:10px}
.shd .back{margin:0;flex:none;width:40px;height:40px;padding:0;font-size:20px;border-radius:50%}
.shd-t{flex:1;min-width:0;display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.shd-t h2{font-family:var(--disp);font-size:24px;font-weight:700;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shd-n{flex:none;font-size:13px;font-weight:650;color:var(--dim)}
.wrap>.pbar{margin:12px 0 14px;height:5px}
.outils{display:flex;flex-wrap:wrap;gap:8px;margin:-4px 0 14px}
.outils .abtn{flex:1 1 30%;background:var(--card);box-shadow:var(--sh);color:var(--ink)}
.wrap>.tipm{display:inline-block;margin:0 0 12px}
.exl{display:flex;flex-direction:column;gap:8px}
.exl .ex{margin:0}
.ex.plie .exh{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:13px 16px}
.ex.plie .exn{font-size:14px;font-weight:600;color:var(--dim)}
.ex.plie .sets{padding:0 16px 12px}
.ex.plie .st{min-width:0;padding:5px 8px;font-size:11.5px}
.exc{flex:none;font-size:12.5px;font-weight:650;color:var(--dim2)}
.ex.plie.fini .exc{color:var(--prim2)}
.ex.fini{opacity:.6}
.lien.opt{display:block;margin:0 auto;padding:0 18px 14px;font-size:12.5px}
/* pavé : la ligne du haut n'a plus que la série et l'objectif */
.padt{margin-bottom:10px}
.ex.jr .exn{color:var(--ink);font-weight:650;display:flex;align-items:center;gap:2px}
.ex.jr .exh{align-items:center}
.ex.jr .info{vertical-align:0;margin-left:6px}
.jr-o{padding:0 16px 12px;margin-top:-6px;font-size:12px;font-weight:650;color:var(--prim2)}

/* ════════════════ RÉGULARITÉ (v22) ════════════════ */
.reg{margin-top:12px;padding:14px 14px 12px;border-radius:var(--r2);background:var(--card);box-shadow:var(--sh)}
.reg-t{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.reg-t b{font-family:var(--disp);font-size:24px;font-weight:700;line-height:1}
.reg-t div:first-child{font-size:13px;font-weight:650;color:var(--ink);line-height:1.3}
.reg-t span{color:var(--dim);font-weight:600}
.reg-t .tg.mini button{padding:7px 11px;min-height:32px;font-size:11.5px}
.reg-b+.reg-b{margin-top:10px}
.reg-m,.reg-g{display:grid;grid-template-columns:repeat(26,minmax(0,1fr));gap:3px}
.reg-m{margin-bottom:4px;height:13px}
.reg-m span{font-size:10px;font-weight:650;color:var(--dim2);white-space:nowrap;overflow:visible}
.reg-g{grid-auto-flow:column;grid-template-rows:repeat(7,auto)}
.reg-g i,.reg-l i{display:block;aspect-ratio:1;border-radius:3px;background:var(--card2)}
.reg-g i.rep{background:color-mix(in srgb,var(--card2) 55%,transparent)}
.reg-g i.rate{background:var(--card2);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--coral) 45%,transparent)}
.reg-g i.av,.reg-g i.fut{background:transparent}
.reg-g i.pz{background:repeating-linear-gradient(45deg,var(--card2) 0 2px,transparent 2px 4px)}
.reg-g i.auj{background:var(--card2);box-shadow:inset 0 0 0 1.5px var(--prim)}
.ok.n1{background:color-mix(in srgb,var(--prim) 45%,var(--card2))!important}
.ok.n2{background:color-mix(in srgb,var(--prim) 72%,var(--card2))!important}
.ok.n3{background:var(--prim)!important}
.reg-g i.cj{outline:2px solid var(--ink);outline-offset:1px}
.reg-l{display:flex;align-items:center;justify-content:flex-end;gap:4px;margin-top:9px;font-size:10.5px;font-weight:600;color:var(--dim2)}
.reg-l i{width:10px;height:10px;flex:none}
.reg-l i.rate{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--coral) 45%,transparent);margin-left:0}
.reg-l i.ok.n1{margin-left:8px}
.reg-l i.rep{background:color-mix(in srgb,var(--card2) 55%,transparent);box-shadow:inset 0 0 0 1px var(--line);margin-left:8px}

/* ════════════════ VACANCES (v23) ════════════════ */
.alerte.vac{background:rgba(46,124,246,.10);box-shadow:none;align-items:center}
.alerte.vac .al-tx{display:block}
.vac-b{flex:none;padding:9px 13px;border-radius:999px;background:var(--card);color:var(--blue);font-size:12.5px;font-weight:700;
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--blue) 35%,transparent);min-height:38px}
.vac-b.on{background:var(--blue);color:#fff;box-shadow:none}
/* dans la grille : un trait bleu sous chaque jour de vacances */
.reg-g i.vac{position:relative}
.reg-g i.vac::after{content:"";position:absolute;left:15%;right:15%;bottom:-2px;height:2px;border-radius:1px;background:var(--blue);opacity:.75}
.reg-l i.vacl{width:10px;height:2px;border-radius:1px;background:var(--blue);margin-left:8px;aspect-ratio:auto}

/* ════════════════ ROLLING COUNTER (v23) ════════════════
   Porté de Bencho (MIT). Ses jetons sont rattachés à ceux de l'app sur la
   racine du composant, rien ne fuit au-dehors :
     --fill-slab → --card (la dalle)    --fill-on → --ink (l'encre)
     --font-ui   → --txt (police UI)    --signal  → --prim (focus)
     --pane-edge → --line (filet) */
.rct{
  --fill-slab:var(--card);--fill-on:var(--ink);--font-ui:var(--txt);--signal:var(--prim);--pane-edge:var(--line);
  --rct-r:16px;--rct-in:11px;--rct-cell:42px;
  font-family:var(--font-ui);
  /* positioned so the canvas's grab halo does not paint over the buttons */
  position:relative;
  display:inline-flex;
  align-items:center;
  gap:0;
  /* 5px round each key — above, below and at the box's end —
     and the corner is the box's less that same 5, so the keys
     sit concentric in it at any Corner */
  padding:5px;
  border-radius:var(--rct-r);
