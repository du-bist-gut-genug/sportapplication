/* On centre l'exercice en cours dans la partie VISIBLE de l'écran, entre l'en-tête
   et le pavé de saisie : centré sur tout l'écran, le bas de la carte (− 1 série,
   Remplacer…) finissait caché sous le pavé. Appelé aussi quand seul le pavé change
   (fin du chrono de repos), car sa hauteur change alors. */
function centrerExercice(){
  if(vue!=="seance"||!S.active||modal)return;
  var v=vActive(),q=buildQueue(v);
  if(S.active.series.length>=q.length)return;
  var el=document.getElementById("ex-"+resolu(v,q[curPos(q)].i).id);
  if(!el)return;
  requestAnimationFrame(function(){
    var r=el.getBoundingClientRect(),hd=document.querySelector(".hd");
    var pad=document.querySelector("#dock .pad,#dock .tm");
    var haut=hd?hd.getBoundingClientRect().bottom:0,bas=pad?pad.getBoundingClientRect().top:window.innerHeight;
    var marge=Math.max(8,(bas-haut-r.height)/2);
    var cible=window.scrollY+r.top-haut-marge;
    if(Math.abs(cible-window.scrollY)<4)return;
    try{window.scrollTo({top:Math.max(0,cible),behavior:"smooth"});}catch(e){window.scrollTo(0,Math.max(0,cible));}
  });
}
function majDock(){document.getElementById("dock").innerHTML=vDock();ajustePad();apresDock();
  if(document.querySelector("#dock .pad"))centrerExercice();}
/* La barre du bas change de hauteur selon le contexte (navigation, pavé de saisie,
   chrono). On mesure sa hauteur réelle pour que rien ne reste masqué dessous. */
function ajustePad(){
  requestAnimationFrame(function(){
    var d=document.getElementById("dock");
    var el=d&&(d.querySelector(".pad")||d.querySelector(".tm")||d.querySelector(".nav"));
    var h=el?el.getBoundingClientRect().height:0;
    document.documentElement.style.setProperty("--pb",Math.round(h+40)+"px");
  });
}
/* Met à jour uniquement les valeurs affichées, sans redessiner le pavé.
   C'est ce qui supprime le clignotement à chaque appui sur + ou −. */
/* Liste saisie à la française : « 25, 20, 2,5, 1,25 ». La virgule collée est une
   décimale, la virgule suivie d'un espace (ou le point-virgule) sépare les valeurs.
   L'ancien découpage sur chaque virgule transformait 2,5 en 2 et 5. */
function listeNombres(txt){
  return String(txt).trim().split(/\s*;\s*|,\s+|\s+/).map(function(x){return parseFloat(x.replace(",","."));})
    .filter(function(x){return isFinite(x)&&x>0;});
}

function prefill(){

/* ═══════════ MODE SALLE BONDÉE ═══════════
   On coche les blocs indisponibles : ils descendent en fin de séance dans leur
   ordre d'origine, les disponibles remontent. Rien n'est supprimé, tout est
   simplement repoussé, parce qu'une machine se libère en général en cours de séance. */
function reorganiserSelonDispo(bloques){
  var v=vActive(),b=blocsOrdonnes(v);
  var faits=b.filter(blocEntame),libres=b.filter(function(x){return !blocEntame(x);});
  var dispo=[],pris=[];
  libres.forEach(function(x){(bloques.indexOf(x.k)>=0?pris:dispo).push(x);});
  S.active.ordre=faits.concat(dispo,pris).map(function(x){return x.k;});
  S.active.bloques=bloques;
  sauver();
}

/* ═══════════ GLISSER-DÉPOSER ═══════════
   Appui long sur la poignée puis déplacement : la ligne suit le doigt et les
   autres s'écartent. Repose sur les Pointer Events, donc souris et tactile. */
var drag=null;
function ordreLibres(){
  var v=vActive(),b=blocsOrdonnes(v);
  return{faits:b.filter(blocEntame),libres:b.filter(function(x){return !blocEntame(x);})};
}
function dragDebut(e,el){
  var zone=document.getElementById("ordz");if(!zone)return;
  var lignes=[].slice.call(zone.querySelectorAll(".ordi:not(.lock)"));
  var idx=lignes.indexOf(el);if(idx<0)return;
  drag={el:el,zone:zone,lignes:lignes,idx:idx,depart:idx,
        y0:e.clientY,h:el.getBoundingClientRect().height+8};
  el.classList.add("drag");
  el.setPointerCapture&&el.setPointerCapture(e.pointerId);
  vibre(18);
}
function dragBouge(e){
  if(!drag)return;
  var dy=e.clientY-drag.y0;
  drag.el.style.transform="translateY("+dy+"px) scale(1.03)";
  var n=Math.max(0,Math.min(drag.lignes.length-1,drag.depart+Math.round(dy/drag.h)));
  if(n!==drag.idx){
    drag.idx=n;
    drag.lignes.forEach(function(l,i){
      if(l===drag.el)return;
      var d=0;
      if(drag.depart<n&&i>drag.depart&&i<=n)d=-drag.h;
      if(drag.depart>n&&i>=n&&i<drag.depart)d=drag.h;
      l.style.transition="transform .22s cubic-bezier(.22,1,.36,1)";
      l.style.transform=d?"translateY("+d+"px)":"";
    });
    vibre(8);
  }
}
function dragFin(){
  if(!drag)return;
  var d=drag;drag=null;
  d.lignes.forEach(function(l){l.style.transition="";l.style.transform="";});
  d.el.classList.remove("drag");
  if(d.idx!==d.depart){
    var o=ordreLibres(),lib=o.libres;
    var bl=lib.splice(d.depart,1)[0];
    lib.splice(d.idx,0,bl);
    S.active.ordre=o.faits.concat(lib).map(function(x){return x.k;});
    sauver();vibre(20);
  }
  majOrdre();
}
document.addEventListener("pointerdown",function(e){
  var p=e.target.closest&&e.target.closest('[data-act="poig"]');
  if(!p)return;
  e.preventDefault();
  dragDebut(e,p.closest(".ordi"));
},{passive:false});
document.addEventListener("pointermove",function(e){if(drag){e.preventDefault();dragBouge(e);}},{passive:false});
document.addEventListener("pointerup",dragFin);
document.addEventListener("pointercancel",dragFin);

  if(a==="cote"){

  if(a==="ht"){champ.charge=parseFloat(t.getAttribute("data-w"));vibre(6);majCharge(true);return;}
  if(a==="ht+"||a==="ht-"){pasHaltere(a==="ht+"?1:-1);return;}

  /* l'appui long a déjà fait défiler le compteur : le clic qui suit le relâcher ne compte pas */

  if(a==="marche"){

    modal={t:"reste"};render();return;
  }
  if(a==="finreste"){
    /* On retire les blocs non entamés et on rabote les séries non faites des blocs entamés,
       pour que le volume enregistré corresponde exactement à ce qui a été réalisé. */
    var vv2=vActive();
    if(!S.active.retires)S.active.retires=[];
    if(!S.active.moins)S.active.moins={};
    restants().forEach(function(x){
      if(!x.entame){
        if(S.active.retires.indexOf(x.bl.k)<0)S.active.retires.push(x.bl.k);
      }else{
        x.bl.idx.forEach(function(i){
          var f=S.active.series.filter(function(y){return y.slot===i;}).length;
          var n=nbSeries(vv2,i);
          if(n>f)S.active.moins[i]=(S.active.moins[i]||0)+(n-f);
        });
      }
    });
    sauver();modal={t:"fin"};render();return;

  }

function telecharger(contenu,ext,mime){
  var b=new Blob([ext==="csv"?"\ufeff"+contenu:contenu],{type:mime});
  var u=URL.createObjectURL(b),l=document.createElement("a");
  l.href=u;l.download="muscu-"+new Date().toISOString().slice(0,10)+"."+ext;
  document.body.appendChild(l);l.click();document.body.removeChild(l);
  setTimeout(function(){URL.revokeObjectURL(u);},1000);
}

      var vv=0;ss.forEach(function(x){vv+=(x.charge||1)*x.reps;});
      h+='<tr><td>'+esc(e.nom)+'</td><td>'+
         ss.map(function(x){return (x.cote?x.cote+" ":"")+(e.type==="poids"?fmt(x.charge)+"×"+x.reps:x.reps)+(x.pr?" ★":"");}).join("  ·  ")+
         '</td><td>'+nbFR(Math.round(vv))+' kg</td></tr>';});
    h+='</table>';
    if(l.notes)h+='<div class="note"><b>Note :</b> '+esc(l.notes)+'</div>';
    if(l.ressenti)h+='<div class="note">Ressenti : '+l.ressenti+' / 5'+(l.duree?' · '+l.duree+' min':'')+'</div>';
  });

  var sn=(S.sensations||[]).filter(function(x){return x.date>=ds;});
  if(sn.length){
    h+='<h2>Sensations notées</h2><table><tr><th>Exercice</th><th>Ressenti</th><th>Précision</th></tr>';
    sn.forEach(function(x){
      var r=null;RESSENTIS.forEach(function(y){if(y.k===x.k)r=y;});
      h+='<tr><td>'+esc(getEx(x.exId).nom)+'</td><td>'+(r?r.t:x.k)+'</td><td>'+esc(x.note||"—")+'</td></tr>';});
    h+='</table>';
  }
  h+='<div class="pied"><span>Programme hypertrophie · cycle '+S.cycle+', semaine '+semaineCourante()+'/7</span>'+
     '<span>Édité le '+new Date().toLocaleDateString("fr-FR")+'</span></div></body></html>';
  return h;
}

function versCSV(){
  var L=["date;cycle;semaine;seance;lieu;exercice;serie;charge_kg;reps;record;ressenti"];
  S.logs.forEach(function(l){
    var d=new Date(l.date).toISOString().slice(0,10);
    l.series.forEach(function(s){
      L.push([d,l.cycle,l.semaine,(l.nom||l.seanceId),(l.lieu||""),getEx(s.exId).nom,s.set,
              fmt(s.charge),s.reps,(s.pr?"oui":""),(l.ressenti||"")].join(";"));
    });
  });
  S.mesures.forEach(function(m){
    L.push([new Date(m.date).toISOString().slice(0,10),"","","MESURE","","poids de corps","",
            (m.poidsCorps!=null?fmt(m.poidsCorps):""),"","",""].join(";"));
  });
  return L.join("\n");
}

document.getElementById("fimp").addEventListener("change",function(ev){
  var f=ev.target.files&&ev.target.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(){
    try{
      var j=JSON.parse(r.result);
      if(!Array.isArray(j.logs))throw 0;
      S=Object.assign({},VIDE,j);
      if(!S.customs)S.customs={};
      if(!S.matos)S.matos=JSON.parse(JSON.stringify(MATOS_DEF));
      if(!S.choix)S.choix=Object.assign({},CHOIX_DEF);
      sauver();msg="Importé : "+j.logs.length+" séances.";
    }catch(e){msg="Fichier illisible. Vérifie que c'est bien un export de cette app.";}
    render();
  };
  r.readAsText(f);ev.target.value="";
});

/* Le chrono ne redessine plus tout le dock : il met à jour deux nœuds.
   C'est ce qui corrige le clignotement et les appuis perdus sur +15 s / Passer. */
function battement(){
  if(modal&&modal.t==="echauf"&&modal.fin){
    var r=Math.round((modal.fin-Date.now())/1000);
    var m=document.getElementById("echm");
    if(m)m.textContent=mmss(Math.max(0,r));
    if(r<=0){bip();vibre([180,90,180]);modal.i=(modal.i||0)+1;modal.fin=null;render();}
  }
  if(chronoEx){
    var cx=document.getElementById("chx");
    if(cx)cx.textContent=Math.round((Date.now()-chronoEx)/1000);
  }
  if(finAt===null){if(ile.visible)majIle();return;}
  ileTenirPause();
  var r=Math.round((finAt-Date.now())/1000);
  if(r<=0&&!sonne&&reposPause===null){sonne=true;bip();vibre([200,100,200]);notifier();}
  if(r<=-4){finAt=null;sonne=false;reposPause=null;annulerNotif();majIle();return;}
  majIle();
}
/* une erreur dans le battement ne doit pas se répéter quatre fois par seconde */
var battementCasse=false;
setInterval(function(){
  if(battementCasse)return;
  try{battement();}catch(e){battementCasse=true;noterErreur(e,"chrono");}
},250);
